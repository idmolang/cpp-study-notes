    const ok = Q.ids.filter(id => Q.picks[id] && Q.picks[id].ok).length;
    const wrong = Q.ids.filter(id => Q.picks[id] && !Q.picks[id].ok);
    const nextP = Q.kind === 'part' && PARTS[BY_ID[Q.pid].idx + 1];
    return top + `<div class="qz-res">
      <div>${ok === n ? '🎉 전부 맞았어요!' : ok >= n * 0.6 ? '👍 좋아요!' : '💪 한 번 더 하면 돼요'}</div>
      <div class="big">${ok}<small> / ${n}</small></div>
      <p>${wrong.length ? `틀린 ${wrong.length}문제만 다시 풀어 볼까요?` : '이 묶음은 완벽해요.'}</p>
      <div class="acts">
        ${wrong.length ? `<button class="btn read" data-qstart="retry">🔁 틀린 것만 다시</button>` : ''}
        ${nextP ? `<button class="btn${wrong.length ? '' : ' read'}" data-qstart="part" data-id="${nextP.id}">다음 파트 문제 →</button>` : ''}
        ${Q.kind === 'part' ? `<button class="btn" data-go="${Q.pid}">📘 노트로</button>` : ''}
        <button class="btn" data-qexit>목록</button>
      </div></div>`;
  }
  const id = Q.ids[Q.i], q = QBY[id], pk = Q.picks[id];
  const answered = !!pk;
  let opts;
  if (q.t === 'ox') {
    opts = `<div class="qz-opts ox">${[['O', '⭕ 맞다'], ['X', '❌ 아니다']].map(([v, lab]) => {
      let cls = '';
      if (answered) cls = v === q.a ? 'right' + (pk.ok ? ' pop' : '') : (pk.v === v ? 'wrong' : 'dim');
      return `<button class="qz-opt ${cls}" data-qpick="${v}" ${answered ? 'disabled' : ''}>${lab}</button>`;
    }).join('')}</div>`;
  } else {
    opts = `<div class="qz-opts">${Q.order[id].map((oi, k) => {
      let cls = '';
      if (answered) cls = oi === q.a ? 'right' + (pk.ok ? ' pop' : '') : (pk.v === oi ? 'wrong' : 'dim');
      return `<button class="qz-opt ${cls}" data-qpick="${oi}" ${answered ? 'disabled' : ''}><span class="k">${k + 1}</span><span>${inl(q.o[oi])}</span></button>`;
    }).join('')}</div>`;
  }
  const from = Q.kind !== 'part' ? `<span class="qz-from">${esc(BY_ID[q.pid].chapter.title.split(' · ')[0])} · ${esc(String(BY_ID[q.pid].title).replace(/[`*]/g, ''))}</span>` : '';
  const fb = !answered ? '' : pk.ok
    ? `<div class="qz-fb ok"><b>✓ 정답!</b>${inl(q.why)}</div>`
    : `<div class="qz-fb bad"><b>앗, 정답은 초록색이에요</b>${inl(q.why)}<br><button class="go" data-go="${q.pid}">📘 노트 그 자리 보기</button></div>`;
  return top + `<div class="qz-card"><span class="qz-type">${QTYPE[q.t]}</span>${from}
    <div class="qz-q">${inl(q.q)}</div>
    ${q.c ? codeBlock(q.c, { noRun: true }) : ''}
    ${opts}${fb}
    ${answered ? `<div class="qz-next"><button class="btn read" data-qnext>${Q.i + 1 < n ? '다음 문제 →' : '결과 보기'}</button></div>` : ''}
  </div>`;
}
function quizPick(v) {
  const Q = state.quiz; if (!Q || Q.i >= Q.ids.length) return;
  const id = Q.ids[Q.i], q = QBY[id];
  if (Q.picks[id]) return;
  const val = q.t === 'ox' ? v : +v;
  const ok = val === q.a;
  Q.picks[id] = { v: val, ok };
  qres[id] = ok ? 1 : 0; store.set('qres', qres);
  render({ keepScroll: true });
  if (ok) { const done = (QUIZ[q.pid] || []).every(x => qres[x.id] === 1); if (done && Q.kind === 'part' && Q.i === Q.ids.length - 1) confetti(); }
  const nb = document.querySelector('[data-qnext]'); if (nb) nb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function quizNext() {
  const Q = state.quiz; if (!Q) return;
  Q.i++;
  if (Q.i >= Q.ids.length && Q.ids.every(id => Q.picks[id] && Q.picks[id].ok)) confetti();
  render();
}
function confetti() {
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['var(--accent)', 'var(--ok)', 'var(--amber)', 'var(--mem)', 'var(--warn)'];
  for (let i = 0; i < 18; i++) {
    const e = document.createElement('i'); const a = Math.random() * Math.PI * 2, r = 80 + Math.random() * 120;
    e.style.cssText = `background:${cols[i % 5]};--x:${Math.cos(a) * r}px;--y:${Math.sin(a) * r}px`;
    box.appendChild(e);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 1000);
}
function renderCheck() {
  CODES.length = 0;
  const mode = state.checkMode;
  const seg = `<div class="seg-ctl" role="group">
    <button data-mode="stars" aria-pressed="${mode === 'stars'}">⭐ 시험 직전 요약</button>
    <button data-mode="quiz" aria-pressed="${mode === 'quiz'}">✅ 확인 문제</button>
    <button data-mode="fix" aria-pressed="${mode === 'fix'}">📝 PPT 정정</button></div>`;
  if (mode === 'quiz') {
    page.innerHTML = `<div class="panel">${state.quiz ? quizRunner() : '<h1>✅ 체크</h1>' + seg + quizHome()}</div>`;
    return;
  }
  let body = '';
  if (mode === 'stars') {
    const stars = DATA.chapters.map(c => ({ c, rows: c.parts.flatMap(p => p.blocks.filter(b => b.t === 'star').map(b => ({ p, x: b.x }))) }));
    const total = stars.reduce((a, s) => a + s.rows.length, 0);
    body = `<p class="lead">장마다 ⭐ 시험 포인트만 모았어요. 총 ${total}개 — 오른쪽을 누르면 노트 그 자리로 가요.</p>` +
      stars.map(({ c, rows }) => `<section class="stars-ch"><h2>${esc(c.title)} <small>${esc(c.sub)} · ${rows.length}개</small></h2>
        ${rows.map(r => `<div class="star-row"><div class="tx">${inl(r.x)}</div><button data-go="${r.p.id}">${esc(r.p.ch)} →</button></div>`).join('')}</section>`).join('');
  } else {
    const fixes = PARTS.flatMap(p => p.blocks.filter(b => b.t === 'fix').map(b => ({ p, x: b.x })));
    body = `<p class="lead">PPT에서 틀렸거나 빠진 곳 ${fixes.length}개. 노트에는 고친 내용으로 반영했어요.</p>` +
      fixes.map(r => `<div class="star-row"><div class="tx fx">${inl(r.x)}</div><button data-go="${r.p.id}">${esc(r.p.chapter.title.split(' · ')[0])} · ${esc(r.p.ch)} →</button></div>`).join('');
  }
  page.innerHTML = `<div class="panel"><h1>✅ 체크</h1>${seg}${body}</div>`;
}

/* ── routing ── */
function render(opts = {}) {
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === state.tab));
  page.classList.remove('wide');
  if (state.tab === 'notes') renderPart(opts.justRead);
  else if (state.tab === 'practice') renderPractice();
  else renderCheck();
  renderSide(); renderStrip();
  if (!opts.keepScroll) window.scrollTo({ top: 0 });
}
function go(id) {
  if (!BY_ID[id]) return;
  state.tab = 'notes'; state.part = id; store.set('last', id);
  setHash(id); render();
}
function setTab(t) {
  state.tab = t; setHash(t === 'notes' ? state.part : t === 'practice' && state.mission ? state.mission : t); render();
}
function setHash(h) { try { history.replaceState(null, '', '#' + h); } catch { location.hash = h; } }
function fromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (BY_ID[h]) { state.tab = 'notes'; state.part = h; }
  else if (MBY[h]) { state.tab = 'practice'; state.mission = h; }
  else if (h === 'practice' || h === 'check') state.tab = h;
  else { const last = store.get('last', null); if (last && BY_ID[last]) state.part = last; }
}

document.querySelectorAll('.tab').forEach(t => t.onclick = () => setTab(t.dataset.tab));
page.addEventListener('click', e => {
  const t = e.target;
  const g = t.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  if (t.closest('#readBtn')) { toggleRead(); return; }
  const sc = t.closest('[data-sec]'); if (sc) { const el = document.getElementById('sec-' + sc.dataset.sec); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  const tg = t.closest('[data-tabgo]'); if (tg) { setTab(tg.dataset.tabgo); return; }
  const m = t.closest('[data-mode]'); if (m) { state.checkMode = m.dataset.mode; state.quiz = null; render({ keepScroll: true }); return; }
  const qp = t.closest('[data-qpick]'); if (qp && !qp.disabled) { quizPick(qp.dataset.qpick); return; }
  if (t.closest('[data-qnext]')) { quizNext(); return; }
  if (t.closest('[data-qexit]')) { state.quiz = null; render(); return; }
  const qz = t.closest('[data-quizpart]'); if (qz) { const pid = qz.dataset.quizpart; startQuiz((QUIZ[pid] || []).map(q => q.id), String(BY_ID[pid].title).replace(/[`*]/g, ''), 'part', pid); return; }
  const qs = t.closest('[data-qstart]');
  if (qs) {
    const k = qs.dataset.qstart, id = qs.dataset.id;
    if (k === 'part') startQuiz((QUIZ[id] || []).map(q => q.id), String(BY_ID[id].title).replace(/[`*]/g, ''), 'part', id);
    else if (k === 'chapter') { const c = DATA.chapters.find(c => c.id === id); startQuiz(c.parts.flatMap(p => (QUIZ[p.id] || []).map(q => q.id)), c.title, 'chapter'); }
    else if (k === 'wrong') startQuiz(wrongIds(), '틀린 문제 다시 풀기', 'wrong');
    else if (k === 'retry') { const Q = state.quiz; startQuiz(Q.ids.filter(i => !Q.picks[i].ok), Q.title + ' · 다시', Q.kind === 'part' ? 'part' : 'wrong', Q.pid); }
    return;
  }
  const c = t.closest('[data-copy]');
  if (c) {
    const src = CODES[+c.dataset.copy];
    (navigator.clipboard ? navigator.clipboard.writeText(src) : Promise.reject()).then(() => toast('코드를 복사했어요'), () => toast('복사가 막혀 있어요 — 직접 드래그해 주세요'));
    return;
  }
  const mi = t.closest('[data-mission]'); if (mi) { openMission(mi.dataset.mission); return; }
  if (t.closest('[data-pexit]')) { state.mission = null; state.pc = null; setHash('practice'); render(); return; }
  if (t.closest('[data-prun]')) { practiceAction('run'); return; }
  if (t.closest('[data-pgrade]')) { practiceAction('grade'); return; }
  const ph = t.closest('[data-phint]'); if (ph && !ph.disabled) { practiceAction('hint'); return; }
  if (t.closest('[data-preset]')) { practiceAction('reset'); return; }
  const pa = t.closest('[data-pans]'); if (pa && !pa.disabled) { practiceAction('ans'); return; }
});

/* ── search ── */
const q = $('#q'), results = $('#results'), sbox = $('#searchBox');
const strip_ = s => String(s).replace(/[`*]/g, '');
const INDEX = PARTS.map(p => {
  const bits = [p.title, p.sum, ...p.key];
  p.blocks.forEach(b => {
    if (b.x && typeof b.x === 'string') bits.push(b.x);
    else if (Array.isArray(b.x)) bits.push(b.x.flat().join(' '));
    if (b.t === 'tbl') bits.push(b.h.join(' '), b.r.flat().join(' '));
    if (b.t === 'term') bits.push(b.ko, b.en, b.d);
    if (b.t === 'trap') bits.push(b.x.flat().join(' '));
    if (b.t === 'vs') bits.push(b.a.h, b.a.x, b.b.h, b.b.x, b.a.n || '', b.b.n || '');
  });
  const text = strip_(bits.join(' \n '));
  return { p, text, low: text.toLowerCase() };
});
let sel = -1, hits = [];
function doSearch() {
  const raw = q.value.trim();
  if (!raw) { results.classList.remove('open'); return; }
  const terms = raw.toLowerCase().split(/\s+/).filter(Boolean);
  hits = INDEX.map(it => {
    if (!terms.every(t => it.low.includes(t))) return null;
    let score = 0; const tl = (it.p.title + ' ' + it.p.sum).toLowerCase();
    terms.forEach(t => { if (tl.includes(t)) score += 5; score += Math.min(5, it.low.split(t).length - 1); });
    return { it, score };
  }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 10);
  sel = hits.length ? 0 : -1;
  if (!hits.length) { results.innerHTML = '<div class="empty">찾는 말이 노트에 없어요. 다른 낱말로 해 보세요.</div>'; results.classList.add('open'); return; }
  const re = new RegExp(terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'gi');
  results.innerHTML = hits.map(({ it }, i) => {
    const pos = it.low.indexOf(terms[0]);
    const s = Math.max(0, pos - 24);
    let snip = it.text.slice(s, s + 90).replace(/\s+/g, ' ');
    snip = (s > 0 ? '…' : '') + esc(snip).replace(re, m => `<mark>${m}</mark>`) + '…';
    return `<button role="option" class="${i === sel ? 'sel' : ''}" data-go="${it.p.id}"><span class="rt">${esc(strip_(it.p.title))}</span><span class="rc">${esc(it.p.chapter.title.split(' · ')[0])}</span><span class="rs">${snip}</span></button>`;
  }).join('');
  results.classList.add('open');
}
let st; q.addEventListener('input', () => { clearTimeout(st); st = setTimeout(doSearch, 90); });
q.addEventListener('focus', () => { sbox.classList.add('focus'); if (q.value.trim()) doSearch(); });
q.addEventListener('blur', () => setTimeout(() => { results.classList.remove('open'); sbox.classList.remove('focus'); }, 160));
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!hits.length) return; e.preventDefault();
    sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length;
    results.querySelectorAll('button').forEach((b, i) => b.classList.toggle('sel', i === sel));
  } else if (e.key === 'Enter' && sel >= 0) { go(hits[sel].it.p.id); q.blur(); }
  else if (e.key === 'Escape') { q.value = ''; q.blur(); }
});
results.addEventListener('mousedown', e => { const b = e.target.closest('[data-go]'); if (b) { e.preventDefault(); go(b.dataset.go); q.value = ''; q.blur(); } });

/* ── nav drawer ── */
function closeNav() { document.body.classList.remove('nav-open'); }
$('#menuBtn').onclick = () => { renderSide(); document.body.classList.add('nav-open'); };
$('#scrim').onclick = closeNav;

/* ── keyboard ── */
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === '/') { e.preventDefault(); q.focus(); }
  if (state.tab === 'check' && state.quiz) {
    const Q = state.quiz, cq = QBY[Q.ids[Q.i]];
    if (cq && !Q.picks[cq.id]) {
      if (cq.t === 'ox' && /^[oOxX]$/.test(e.key)) { quizPick(e.key.toUpperCase()); return; }
      if (cq.o && /^[1-9]$/.test(e.key)) { const oi = Q.order[cq.id][+e.key - 1]; if (oi !== undefined) quizPick(oi); return; }
    } else if (e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); quizNext(); return; }
    return;
  }
  if (state.tab !== 'notes') return;
  const p = BY_ID[state.part];
  if (e.key === 'ArrowRight' && PARTS[p.idx + 1]) go(PARTS[p.idx + 1].id);
  if (e.key === 'ArrowLeft' && PARTS[p.idx - 1]) go(PARTS[p.idx - 1].id);
});

/* ── toast ── */
let tt;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1800); }

fromHash(); render();
window.addEventListener('hashchange', () => { fromHash(); render(); });
})();
</script>

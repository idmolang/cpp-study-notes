<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C++ 시험 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #151a21;
  --bg2: #1a2029;
  --panel: #1e252f;
  --panel2: #232b37;
  --line: #2c3541;
  --text: #dfe4ea;
  --muted: #929eae;
  --faint: #5f6b7b;
  --accent: #7cc4ff;
  --accent-ink: #0b1a29;
  --amber: #f2b84b;
  --warn: #ff8f80;
  --mem: #c3a6ff;
  --ok: #6fd49a;
  --ref: #9aa6b5;
  --fix: #6fd8c8;
  --s-kw: #8fb0ff;
  --s-ty: #74d6c4;
  --s-str: #e8c47e;
  --s-num: #f79a76;
  --s-com: #6c7a8c;
  --s-pre: #c7aaff;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "D2Coding", monospace;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"] { color-scheme: dark; }
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f7f9;
  --bg2: #eceff3;
  --panel: #ffffff;
  --panel2: #f1f3f6;
  --line: #d9dee5;
  --text: #19212b;
  --muted: #566273;
  --faint: #8a95a3;
  --accent: #0a62bd;
  --accent-ink: #ffffff;
  --amber: #8f5a00;
  --warn: #b8322a;
  --mem: #6340b8;
  --ok: #17784a;
  --ref: #5a6677;
  --fix: #0b7366;
  --s-kw: #3d43c4;
  --s-ty: #0b7366;
  --s-str: #8f5300;
  --s-num: #b03d18;
  --s-com: #7a8595;
  --s-pre: #7339bb;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 110px); height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 16px; line-height: 1.7;
  -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 60; background: var(--bg2);
}
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code, pre, .mono { font-family: var(--mono); }

/* ───────── top bar ───────── */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  background: var(--bg2); border-bottom: 1px solid var(--line);
}
.bar {
  display: flex; align-items: center; gap: 14px;
  height: 54px; padding: 0 16px;
}
.menu-btn { display: none; background: none; border: 0; padding: 6px; cursor: pointer; border-radius: 6px; }
.menu-btn svg { display: block; }
.brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.brand b { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.brand span { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.progress { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
.strip { flex: 1; min-width: 60px; display: flex; gap: 6px; height: 16px; align-items: center; }
.strip .grp { display: flex; gap: 2px; flex: var(--n); height: 100%; }
.strip .seg {
  flex: 1; height: 100%; border: 0; padding: 0; cursor: pointer; border-radius: 2px;
  background: var(--line); transition: background .25s;
}
.strip .seg.done { background: var(--ok); }
.strip .seg.cur { box-shadow: inset 0 0 0 2px var(--accent); }
.strip .seg.pulse { animation: pulse .6s ease-out; }
@keyframes pulse { 0% { transform: scaleY(1.9); } 100% { transform: scaleY(1); } }
.pct { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.pct b { color: var(--text); font-weight: 500; }
.search { position: relative; width: 240px; }
.search input {
  width: 100%; height: 34px; padding: 0 30px 0 32px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text);
  font: 14px var(--sans);
}
.search input::placeholder { color: var(--faint); }
.search svg { position: absolute; left: 10px; top: 10px; color: var(--faint); }
.search kbd {
  position: absolute; right: 8px; top: 8px; font: 11px var(--mono); color: var(--faint);
  border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; line-height: 16px;
}
.results {
  position: absolute; right: 0; top: 40px; width: min(420px, 92vw); max-height: 60vh; overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 12px 32px rgba(0,0,0,.28); padding: 6px; display: none;
}
.results.open { display: block; }
.results button {
  display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
  padding: 8px 10px; border-radius: 6px; line-height: 1.5;
}
.results button:hover, .results button.sel { background: var(--panel2); }
.results .rt { font-weight: 600; font-size: 14px; }
.results .rc { font: 11.5px var(--mono); color: var(--muted); margin-left: 6px; }
.results .rs { font-size: 13px; color: var(--muted); display: block; }
.results mark { background: color-mix(in srgb, var(--amber) 30%, transparent); color: inherit; border-radius: 2px; }
.results .empty { padding: 10px; color: var(--muted); font-size: 14px; }
.icon-btn {
  background: none; border: 1px solid var(--line); height: 34px; width: 34px; border-radius: 8px;
  cursor: pointer; display: grid; place-items: center; color: var(--muted);
}
.icon-btn:hover { color: var(--text); }

.tabs { display: flex; gap: 2px; padding: 0 12px; overflow-x: auto; }
.tab {
  background: none; border: 0; cursor: pointer; padding: 9px 16px 10px; font-size: 14.5px;
  color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tab small { white-space: nowrap; font: 11px var(--mono); color: var(--faint); margin-left: 6px; }

/* ───────── layout ───────── */
.wrap { display: grid; grid-template-columns: 292px minmax(0, 1fr); min-height: calc(100vh - 100px); }
.side {
  border-right: 1px solid var(--line); background: var(--bg);
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 100px);
  height: calc(100vh - 100px - env(safe-area-inset-top, 0px)); overflow-y: auto; padding: 14px 10px 40px;
}
.ch { margin-bottom: 4px; }
.ch-head {
  width: 100%; display: flex; align-items: center; gap: 8px; background: none; border: 0; cursor: pointer;
  text-align: left; padding: 7px 8px; border-radius: 6px; font-weight: 600; font-size: 14.5px; line-height: 1.4;
}
.ch-head:hover { background: var(--bg2); }
.ch-head .chev { transition: transform .2s; color: var(--faint); flex: none; }
.ch.open .chev { transform: rotate(90deg); }
.ch-head .cnt { white-space: nowrap; margin-left: auto; font: 11.5px var(--mono); color: var(--faint); font-weight: 400; }
.ch-head .cnt.full { color: var(--ok); }
.ch-parts { display: none; padding: 2px 0 8px; }
.ch.open .ch-parts { display: block; }
.pl {
  width: 100%; display: flex; gap: 8px; align-items: flex-start; background: none; border: 0; cursor: pointer;
  text-align: left; padding: 5px 8px 5px 28px; border-radius: 6px; font-size: 13.5px; line-height: 1.45; color: var(--muted);
}
.pl:hover { background: var(--bg2); color: var(--text); }
.pl.cur { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--text); }
.pl .mk { width: 14px; flex: none; font-family: var(--mono); font-size: 12px; color: var(--faint); padding-top: 1px; }
.pl.done .mk { color: var(--ok); }

main { min-width: 0; padding: 30px 40px 120px; }
.page { max-width: 800px; margin: 0 auto; }

/* ───────── part page ───────── */
.crumb { font: 12.5px var(--mono); color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.crumb .rd { color: var(--ok); }
h1 { font-size: 27px; line-height: 1.35; margin: 6px 0 16px; letter-spacing: -0.015em; font-weight: 700; }
.sum {
  border-left: 3px solid var(--accent); padding: 10px 14px; margin: 0 0 26px;
  background: color-mix(in srgb, var(--accent) 7%, transparent); border-radius: 0 8px 8px 0; font-weight: 500;
}
.sum .lb { display: block; font: 11.5px var(--mono); color: var(--accent); margin-bottom: 2px; }
.blk { margin: 0 0 16px; }
h2.bh { font-size: 18px; margin: 34px 0 12px; padding-top: 14px; border-top: 1px solid var(--line); letter-spacing: -0.01em; }
p.bp { margin: 0 0 14px; }
ul.bl { margin: 0 0 16px; padding-left: 20px; }
ul.bl li { margin: 3px 0; }
ul.bl li::marker { color: var(--faint); }
.ic {
  font-family: var(--mono); font-size: .86em; background: var(--panel2); border: 1px solid var(--line);
  padding: 1px 5px; border-radius: 5px; white-space: nowrap;
}
strong { font-weight: 700; }

dl.bd { display: grid; grid-template-columns: minmax(130px, max-content) 1fr; margin: 0 0 18px; border-top: 1px solid var(--line); }
dl.bd dt, dl.bd dd { padding: 8px 0; border-bottom: 1px solid var(--line); margin: 0; }
dl.bd dt { font-weight: 600; padding-right: 18px; }
dl.bd dd { color: var(--text); }

.term { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px dashed var(--line); margin: 0 0 8px; }
.term .tg { font: 11px var(--mono); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); padding: 0 6px; border-radius: 4px; }
.term .ko { font-weight: 700; }
.term .en { font: 13px var(--mono); color: var(--muted); }
.term .d { flex-basis: 100%; color: var(--text); font-size: 15px; }

.tw { overflow-x: auto; margin: 0 0 18px; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.55; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--bg2); font-weight: 600; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td:first-child { font-weight: 500; }

.code { margin: 0 0 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
.code-h { display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 12px; border-bottom: 1px solid var(--line); background: var(--panel2); }
.code-h .lang { font: 11.5px var(--mono); color: var(--faint); margin-right: auto; }
.cbtn {
  font: 12px var(--sans); background: none; border: 1px solid transparent; color: var(--muted);
  padding: 2px 9px; border-radius: 5px; cursor: pointer; height: 26px;
}
.cbtn:hover { color: var(--text); border-color: var(--line); }
.cbtn.run { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); font-weight: 600; }
.cbtn.run:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.code-b { display: grid; grid-template-columns: auto 1fr; overflow-x: auto; }
.code-b pre { margin: 0; padding: 12px 14px 14px; font-size: 13.5px; line-height: 1.62; tab-size: 4; }
.code-b .gut { color: var(--faint); text-align: right; user-select: none; padding-right: 10px; border-right: 1px solid var(--line); opacity: .8; }
.code-b .src { padding-left: 14px; }
.t-kw { color: var(--s-kw); }
.t-ty { color: var(--s-ty); }
.t-str { color: var(--s-str); }
.t-num { color: var(--s-num); }
.t-com { color: var(--s-com); font-style: italic; }
.t-pre { color: var(--s-pre); }

.out { margin: 0 0 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); overflow: hidden; }
.out-h { font: 11.5px var(--mono); color: var(--ok); padding: 6px 12px; border-bottom: 1px dashed var(--line); display: flex; gap: 6px; align-items: center; }
.out-h::before { content: "▸"; }
.out pre { margin: 0; padding: 10px 14px 12px; font-size: 13px; line-height: 1.6; overflow-x: auto; color: var(--text); }

.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 0 18px; }
.vs .side-c { min-width: 0; display: flex; flex-direction: column; }
.vs .vh { font-weight: 600; font-size: 14px; padding: 0 2px 6px; display: flex; gap: 6px; align-items: center; }
.vs .vh::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
.vs .side-c:last-child .vh::before { background: var(--ok); }
.vs .code { margin: 0; flex: 1; }
.vs .vn { font-size: 13.5px; color: var(--muted); padding: 6px 2px 0; }

.flow { display: flex; gap: 0; margin: 0 0 20px; flex-wrap: wrap; row-gap: 10px; }
.flow .st { flex: 1 1 130px; min-width: 120px; position: relative; padding: 10px 14px 10px 12px; border-top: 2px solid var(--accent); }
.flow .st + .st { margin-left: 14px; }
.flow .st + .st::before { content: "→"; position: absolute; left: -14px; top: 8px; color: var(--faint); font-family: var(--mono); }
.flow .st b { display: block; font-size: 14.5px; line-height: 1.4; margin-bottom: 3px; }
.flow .st span { display: block; font-size: 13.5px; color: var(--muted); line-height: 1.5; }

.co { margin: 0 0 16px; padding: 10px 14px; border-radius: 0 8px 8px 0; border-left: 3px solid var(--c); background: color-mix(in srgb, var(--c) 9%, transparent); }
.co .lb { display: block; font-size: 12.5px; font-weight: 700; color: var(--c); margin-bottom: 1px; }
.co.star { --c: var(--amber); }
.co.warn { --c: var(--warn); }
.co.mem { --c: var(--mem); }
.co.tip { --c: var(--ok); }
.co.ref { --c: var(--ref); }
.co.fix { --c: var(--fix); border-left-style: dashed; }

/* key lines + actions */
.keys { margin: 40px 0 0; border-top: 1px solid var(--line); padding-top: 18px; }
.keys h3 { font-size: 15px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
.keys ol { list-style: none; margin: 0; padding: 0; counter-reset: k; }
.keys li { counter-increment: k; display: flex; gap: 12px; padding: 7px 0; font-weight: 500; }
.keys li::before { content: counter(k); font: 600 13px var(--mono); color: var(--accent-ink); background: var(--accent); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; margin-top: 2px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; margin: 24px 0 0; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); font-weight: 600; font-size: 14.5px;
}
.btn:hover { border-color: var(--muted); }
.btn .soon { font: 500 11px var(--mono); color: var(--faint); }
.btn.read { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.read.is-done { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); border-color: var(--ok); }
.btn.read svg path { stroke-dasharray: 20; stroke-dashoffset: 0; }
.btn.read.just svg path { animation: draw .45s ease-out; }
@keyframes draw { from { stroke-dashoffset: 20; } to { stroke-dashoffset: 0; } }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 30px; }
.pager button { text-align: left; background: none; border: 1px solid var(--line); border-radius: 9px; padding: 10px 14px; cursor: pointer; line-height: 1.45; min-height: 60px; }
.pager button:hover { border-color: var(--accent); }
.pager button:last-child { text-align: right; }
.pager small { display: block; font: 11.5px var(--mono); color: var(--muted); }
.pager span { font-weight: 600; font-size: 14.5px; }
.pager .ph { visibility: hidden; }

/* other tabs */
.panel h1 { margin-top: 0; }
.lead { color: var(--muted); margin: -6px 0 26px; }
.stars-ch { margin: 0 0 30px; }
.stars-ch h2 { font-size: 17px; margin: 0 0 4px; display: flex; gap: 10px; align-items: baseline; }
.stars-ch h2 small { font: 12px var(--mono); color: var(--muted); font-weight: 400; }
.star-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: start; }
.star-row .tx { font-size: 15px; }
.star-row .tx::before { content: "⭐ "; }
.star-row .tx.fx::before { content: "📝 "; }
.star-row button { background: none; border: 0; cursor: pointer; font: 11.5px var(--mono); color: var(--accent); white-space: nowrap; padding: 2px 0; }
.soon-box { border: 1px dashed var(--line); border-radius: 10px; padding: 18px 20px; margin: 0 0 30px; }
.soon-box h2 { font-size: 17px; margin: 0 0 6px; }
.soon-box p { margin: 0; color: var(--muted); }
.soon-box ol { margin: 10px 0 0; padding-left: 20px; color: var(--muted); }
.seg-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 3px; margin: 0 0 24px; gap: 2px; }
.seg-ctl button { background: none; border: 0; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; color: var(--muted); font-weight: 500; }
.seg-ctl button[aria-pressed="true"] { background: var(--panel2); color: var(--text); }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14.5px;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 80; max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.scrim { display: none; }

@media (max-width: 960px) {
  .menu-btn { display: block; }
  .wrap { grid-template-columns: 1fr; }
  .side {
    position: fixed; z-index: 70; left: 0; top: 0; bottom: 0; width: min(320px, 86vw); height: auto;
    padding-top: calc(env(safe-area-inset-top, 0px) + 14px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px);
    transform: translateX(-102%); transition: transform .22s ease; background: var(--bg2);
  }
  body.nav-open .side { transform: none; }
  body.nav-open .scrim { display: block; position: fixed; inset: 0; z-index: 65; background: rgba(0,0,0,.45); }
  main { padding: 22px 18px 100px; }
  .search { width: 34px; }
  .search input { padding: 0; width: 34px; color: transparent; cursor: pointer; }
  .search input::placeholder { color: transparent; }
  .search kbd { display: none; }
  .search.focus { position: absolute; left: 12px; right: 12px; width: auto; z-index: 5; }
  .search.focus input { width: 100%; padding: 0 12px 0 32px; color: var(--text); cursor: text; }
  .search.focus input::placeholder { color: var(--faint); }
}
@media (max-width: 640px) {
  .brand span { display: none; }
  .brand b { font-size: 14px; }
  .progress { flex: 1 1 auto; justify-content: flex-end; }
  .strip { position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; gap: 2px; min-width: 0; }
  .strip .grp { gap: 1px; }
  .strip .seg { border-radius: 0; pointer-events: none; }
  .strip .seg.cur { box-shadow: none; background: var(--accent); }
  .bar { gap: 10px; padding: 0 10px; }
  .pct .lbl { display: none; }
  h1 { font-size: 23px; }
  .vs { grid-template-columns: 1fr; }
  dl.bd { grid-template-columns: 1fr; }
  dl.bd dt { padding-bottom: 0; border-bottom: 0; }
  .flow { flex-direction: column; }
  .flow .st + .st { margin-left: 0; margin-top: 4px; }
  .flow .st + .st::before { content: "↓"; left: auto; right: 6px; top: -22px; }
  .flow .st { border-top: 0; border-left: 2px solid var(--accent); padding: 4px 0 4px 12px; }
  .code-b pre { font-size: 12.5px; }
  .pager span { font-size: 13.5px; }
  .btn { flex: 1 1 auto; justify-content: center; }
  .tab { padding: 9px 12px 10px; }
  .seg-ctl { display: flex; max-width: 100%; overflow-x: auto; }
  .seg-ctl button { white-space: nowrap; padding: 6px 10px; font-size: 13px; flex: 1 0 auto; }
}
@media (max-width: 640px) { .ic { white-space: normal; overflow-wrap: anywhere; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ───────── v2: readability ───────── */
body { font-size: 16.5px; line-height: 1.75; }
h1 { font-size: 30px; margin: 8px 0 18px; }
.tldr { border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: 12px; background: color-mix(in srgb, var(--accent) 8%, var(--bg)); margin: 0 0 16px; overflow: hidden; }
.tldr .lb { display: block; font: 600 12px var(--mono); color: var(--accent); letter-spacing: .04em; margin-bottom: 4px; }
.tl-sum { padding: 16px 20px 14px; font-size: 18px; font-weight: 600; line-height: 1.6; }
.tl-keys { padding: 12px 20px 14px; border-top: 1px dashed color-mix(in srgb, var(--accent) 35%, var(--line)); }
.tl-keys ol { list-style: none; margin: 0; padding: 0; counter-reset: k; }
.tl-keys li { counter-increment: k; display: flex; gap: 12px; padding: 5px 0; font-weight: 500; }
.tl-keys li::before { content: counter(k); font: 600 13px var(--mono); color: var(--accent-ink); background: var(--accent); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; margin-top: 3px; }
.mini { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
.mini button { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 13px; color: var(--muted); cursor: pointer; line-height: 1.6; }
.mini button b { font-family: var(--mono); color: var(--accent); margin-right: 6px; font-weight: 600; }
.mini button:hover { color: var(--text); border-color: var(--accent); }
.sec { padding: 30px 0 4px; margin-top: 24px; border-top: 1px solid var(--line); scroll-margin-top: 120px; }
.sec-h { display: flex; align-items: center; gap: 12px; font-size: 21px; margin: 0 0 18px; letter-spacing: -.01em; line-height: 1.4; }
.sec-h .num { font: 700 13px var(--mono); color: var(--accent-ink); background: var(--accent); border-radius: 6px; padding: 3px 8px; flex: none; }
.blk { margin: 0 0 18px; }
p.bp { margin: 0; }
ul.bl li { margin: 6px 0; }
.co { border-left-width: 4px; padding: 12px 16px 13px; background: color-mix(in srgb, var(--c) 13%, transparent); border-radius: 0 10px 10px 0; }
.co .lb { display: table; font-size: 12.5px; font-weight: 700; color: var(--bg); background: var(--c); padding: 1px 10px; border-radius: 999px; margin-bottom: 7px; }
.co.star { font-weight: 500; }
.co.ref { background: transparent; border-left-width: 2px; font-size: 14.5px; color: var(--muted); padding: 6px 14px; }
.co.ref .lb { display: inline; background: none; color: var(--ref); padding: 0; margin: 0 6px 0 0; }
.co.fix .lb { color: var(--bg); }
.t-com { font-style: normal; color: var(--s-com2); }
:root { --s-com2: #8b9aae; }
:root[data-theme="light"] { --s-com2: #66727f; }
.code-b pre { font-size: 14px; }
th { color: var(--text); background: var(--panel2); }
tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--panel2) 55%, transparent); }
dl.bd dt { color: var(--accent); }
.out { background: color-mix(in srgb, var(--ok) 5%, var(--bg)); border-color: color-mix(in srgb, var(--ok) 30%, var(--line)); }
.out-h { font-weight: 600; }
.term { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; border-bottom-style: solid; }
.flow .st { background: color-mix(in srgb, var(--accent) 6%, transparent); border-radius: 0 0 8px 8px; }
.acts { margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--line); }
@media (max-width: 640px) {
  h1 { font-size: 24px; }
  .tl-sum { font-size: 16.5px; padding: 14px 16px 12px; }
  .tl-keys { padding: 10px 16px 12px; }
  .sec-h { font-size: 18.5px; }
  .code-b pre { font-size: 12.5px; }
  .flow .st { border-radius: 0 8px 8px 0; }
}

/* ───────── v3: card layout ───────── */
.tldr .tl-ana { padding: 12px 20px 14px; border-top: 1px dashed color-mix(in srgb, var(--accent) 35%, var(--line)); font-size: 15.5px; }
.card { border: 1px solid var(--line); border-radius: 14px; background: color-mix(in srgb, var(--panel) 60%, var(--bg)); padding: 20px 22px 6px; margin: 0 0 18px; scroll-margin-top: 120px; }
.card .sec-h { margin: 0 0 16px; }
.card.trapc { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn) 6%, var(--bg)); }
.card.starc { border-color: color-mix(in srgb, var(--amber) 50%, var(--line)); background: color-mix(in srgb, var(--amber) 7%, var(--bg)); }
.card.memc  { border-color: color-mix(in srgb, var(--mem) 45%, var(--line)); background: color-mix(in srgb, var(--mem) 7%, var(--bg)); }
.card.trapc .sec-h .num { background: var(--warn); }
.card.starc .sec-h .num { background: var(--amber); }
.card.memc .sec-h .num { background: var(--mem); }
.parts-gap { height: 10px; }
.trap-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; padding: 0 0 14px; margin: 0 0 14px; border-bottom: 1px dashed var(--line); }
.trap-row:last-child { border-bottom: 0; margin-bottom: 4px; }
.trap-row .bad, .trap-row .good { border-radius: 8px; padding: 8px 12px; font-size: 15px; }
.trap-row .bad { background: color-mix(in srgb, var(--warn) 12%, transparent); }
.trap-row .good { background: color-mix(in srgb, var(--ok) 12%, transparent); }
.trap-row .tag { display: block; font: 700 11.5px var(--mono); margin-bottom: 2px; }
.trap-row .bad .tag { color: var(--warn); }
.trap-row .good .tag { color: var(--ok); }
.trap-row .why { grid-column: 1 / -1; font-size: 14.5px; color: var(--muted); padding-left: 4px; }
.trap-row .why::before { content: "→ 왜? "; color: var(--text); font-weight: 600; }
.star-list { list-style: none; padding: 0; margin: 0 0 14px; }
.star-list li { padding: 8px 0 8px 30px; position: relative; border-bottom: 1px dashed color-mix(in srgb, var(--amber) 30%, var(--line)); font-weight: 500; }
.star-list li:last-child { border-bottom: 0; }
.star-list li::before { content: "⭐"; position: absolute; left: 2px; top: 8px; }
.mem-keys { list-style: none; margin: 0 0 12px; padding: 0; counter-reset: k; }
.mem-keys li { counter-increment: k; display: flex; gap: 12px; padding: 6px 0; font-weight: 600; font-size: 16.5px; }
.mem-keys li::before { content: counter(k); font: 700 13px var(--mono); color: var(--bg); background: var(--mem); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; margin-top: 2px; }
.mem-tip { padding: 10px 14px; border-radius: 10px; background: color-mix(in srgb, var(--mem) 14%, transparent); margin: 0 0 14px; }
.mem-tip::before { content: "🧠 외우는 법  "; font-weight: 700; color: var(--mem); }
.card .tw { background: var(--bg); }
@media (max-width: 640px) {
  .card { padding: 16px 14px 4px; border-radius: 12px; margin: 0 -4px 14px; }
  .trap-row { grid-template-columns: 1fr; }
  .tldr .tl-ana { padding: 10px 16px 12px; }
}

/* ───────── quiz ───────── */
.qz-top { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; }
.qz-top .back { background: none; border: 1px solid var(--line); border-radius: 8px; height: 34px; padding: 0 12px; cursor: pointer; color: var(--muted); font-size: 14px; }
.qz-top .back:hover { color: var(--text); }
.qz-top .ttl { font-weight: 700; font-size: 16px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qz-top .n { font: 600 13px var(--mono); color: var(--muted); }
.qz-dots { display: flex; gap: 5px; margin: 0 0 20px; flex-wrap: wrap; }
.qz-dots span { flex: 1 1 18px; max-width: 60px; height: 6px; border-radius: 3px; background: var(--line); }
.qz-dots span.cur { background: var(--accent); }
.qz-dots span.ok { background: var(--ok); }
.qz-dots span.bad { background: var(--warn); }
.qz-card { border: 1px solid var(--line); border-radius: 14px; background: color-mix(in srgb, var(--panel) 60%, var(--bg)); padding: 22px 22px 20px; }
.qz-type { display: inline-block; font: 700 12px var(--mono); color: var(--accent-ink); background: var(--accent); border-radius: 999px; padding: 2px 10px; margin-bottom: 10px; }
.qz-from { font: 12px var(--mono); color: var(--muted); margin-left: 8px; }
.qz-q { font-size: 18px; font-weight: 600; line-height: 1.6; margin: 0 0 16px; }
.qz-card .code { margin-bottom: 16px; }
.qz-opts { display: grid; gap: 8px; }
.qz-opts.ox { grid-template-columns: 1fr 1fr; }
.qz-opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; min-height: 50px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); cursor: pointer; font-size: 15.5px; line-height: 1.5; transition: border-color .15s, background .15s; }
.qz-opt:hover:not(:disabled) { border-color: var(--accent); }
.qz-opt .k { font: 700 12px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; flex: none; margin-top: 2px; }
.qz-opts.ox .qz-opt { justify-content: center; font-size: 18px; font-weight: 700; min-height: 64px; align-items: center; }
.qz-opt:disabled { cursor: default; }
.qz-opt.dim { opacity: .5; }
.qz-opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--bg)); opacity: 1; }
.qz-opt.wrong { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, var(--bg)); opacity: 1; }
.qz-opt.right .k { background: var(--ok); color: var(--bg); border-color: var(--ok); }
.qz-opt.wrong .k { background: var(--warn); color: var(--bg); border-color: var(--warn); }
.qz-opt.right.pop { animation: pop .35s ease-out; }
@keyframes pop { 0% { transform: scale(.97); } 60% { transform: scale(1.02); } 100% { transform: scale(1); } }
.qz-fb { margin: 16px 0 0; padding: 12px 14px; border-radius: 10px; font-size: 15px; }
.qz-fb b { display: block; margin-bottom: 2px; }
.qz-fb.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); }
.qz-fb.ok b { color: var(--ok); }
.qz-fb.bad { background: color-mix(in srgb, var(--warn) 12%, transparent); }
.qz-fb.bad b { color: var(--warn); }
.qz-fb .go { margin-top: 10px; background: none; border: 1px solid currentColor; color: var(--accent); border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 13.5px; font-weight: 600; }
.qz-next { margin-top: 16px; display: flex; justify-content: flex-end; }
.qz-res { text-align: center; padding: 30px 20px; border: 1px solid var(--line); border-radius: 14px; background: color-mix(in srgb, var(--panel) 60%, var(--bg)); }
.qz-res .big { font: 700 52px var(--mono); line-height: 1.1; margin: 6px 0; }
.qz-res .big small { font-size: 26px; color: var(--muted); }
.qz-res p { margin: 0 0 20px; color: var(--muted); }
.qz-res .acts { justify-content: center; border-top: 0; padding-top: 0; margin-top: 0; }
.qh-quick { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 26px; }
.qh-ch { margin: 0 0 22px; }
.qh-ch h2 { font-size: 16.5px; margin: 0 0 6px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.qh-ch h2 small { font: 12px var(--mono); color: var(--muted); font-weight: 400; }
.qh-ch h2 button { margin-left: auto; background: none; border: 1px solid var(--line); border-radius: 7px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; color: var(--accent); }
.qh-row { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; font-size: 14.5px; }
.qh-row:hover { background: var(--bg2); }
.qh-row .t { flex: 1; min-width: 0; }
.qh-row .sc { font: 600 12px var(--mono); padding: 2px 8px; border-radius: 999px; background: var(--panel2); color: var(--muted); flex: none; }
.qh-row .sc.full { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.qh-row .sc.part { background: color-mix(in srgb, var(--amber) 18%, transparent); color: var(--amber); }
.confetti { position: fixed; left: 50%; top: 45%; width: 0; height: 0; pointer-events: none; z-index: 90; }
.confetti i { position: absolute; width: 8px; height: 8px; border-radius: 2px; animation: boom .9s ease-out forwards; }
@keyframes boom { from { transform: translate(0,0) rotate(0); opacity: 1; } to { transform: translate(var(--x), var(--y)) rotate(320deg); opacity: 0; } }
@media (max-width: 640px) {
  .qz-card { padding: 16px 14px 16px; }
  .qz-q { font-size: 16.5px; }
  .qz-res .big { font-size: 44px; }
}

/* ───────── practice ───────── */
.page.wide { max-width: 1240px; }
.pr-top { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; flex-wrap: wrap; }
.pr-top .back { background: none; border: 1px solid var(--line); border-radius: 8px; height: 34px; padding: 0 12px; cursor: pointer; color: var(--muted); font-size: 14px; }
.pr-top .ttl { font-weight: 700; font-size: 19px; flex: 1; min-width: 0; }
.pr-top .n { font: 600 13px var(--mono); color: var(--muted); }
.pr-top .clr { font: 700 12px var(--mono); color: var(--bg); background: var(--ok); border-radius: 999px; padding: 2px 10px; }
.pr-grid { display: grid; gap: 16px; }
@media (min-width: 1280px) { .pr-grid { grid-template-columns: 330px minmax(0, 1fr); align-items: start; } .pr-mission { position: sticky; top: 120px; } }
.pr-mission { border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; background: color-mix(in srgb, var(--panel) 60%, var(--bg)); }
.pr-mission .lb { display: block; font: 700 12px var(--mono); color: var(--accent); margin-bottom: 4px; }
.pr-goal { font-size: 16.5px; font-weight: 600; line-height: 1.6; margin-bottom: 14px; }
.pr-tests ul { list-style: none; margin: 0 0 14px; padding: 0; }
.pr-tests li { font-size: 13.5px; padding: 5px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 8px; }
.pr-tests li:last-child { border-bottom: 0; }
.pr-tests li .mk { font-family: var(--mono); color: var(--faint); flex: none; width: 14px; }
.pr-tests li.ok .mk { color: var(--ok); } .pr-tests li.bad .mk { color: var(--warn); }
.pr-hint { font-size: 14.5px; padding: 8px 12px; border-radius: 8px; background: color-mix(in srgb, var(--amber) 11%, transparent); margin: 0 0 8px; }
.pr-hint b { color: var(--amber); font-size: 12px; font-family: var(--mono); margin-right: 6px; }
.pr-note { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 13.5px; color: var(--accent); cursor: pointer; margin-top: 6px; }
.pr-work { min-width: 0; }
.pr-editor { border: 1px solid var(--line); border-radius: 12px 12px 0 0; background: var(--panel); overflow-x: auto; padding: 10px 0; font: 14px/1.75 var(--mono); }
.pr-editor .ln { display: flex; white-space: pre; min-width: max-content; }
.pr-editor .g { width: 38px; flex: none; text-align: right; padding-right: 12px; color: var(--faint); user-select: none; }
.pr-editor .c { padding-right: 16px; }
.pr-editor .lock { opacity: .72; }
.pr-editor .blank { font: inherit; color: var(--text); background: color-mix(in srgb, var(--accent) 14%, var(--bg)); border: 1.5px dashed var(--accent); border-radius: 5px; padding: 0 5px; height: 1.6em; min-width: 4ch; margin: 0 1px; outline: none; vertical-align: baseline; }
.pr-editor .blank:focus { border-style: solid; background: color-mix(in srgb, var(--accent) 22%, var(--bg)); }
.pr-editor .blank::placeholder { color: var(--accent); opacity: .6; }
.pr-editor .blank.ok { border-color: var(--ok); border-style: solid; background: color-mix(in srgb, var(--ok) 14%, var(--bg)); }
.pr-editor .blank.bad { border-color: var(--warn); border-style: solid; background: color-mix(in srgb, var(--warn) 12%, var(--bg)); }
.pr-bar { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px; border: 1px solid var(--line); border-top: 0; background: var(--bg2); }
.pr-bar button { height: 38px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 600; font-size: 14px; }
.pr-bar button:hover:not(:disabled) { border-color: var(--muted); }
.pr-bar .run { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pr-bar .grade { background: color-mix(in srgb, var(--ok) 18%, var(--panel)); border-color: var(--ok); color: var(--ok); }
.pr-bar button:disabled { opacity: .45; cursor: not-allowed; }
.pr-bar .sp { flex: 1; }
.pr-con { border: 1px solid var(--line); border-top: 0; border-radius: 0 0 12px 12px; background: #0e1116; color: #d7dde5; padding: 12px 14px 14px; font: 13.5px/1.65 var(--mono); min-height: 120px; }
:root[data-theme="light"] .pr-con { background: #1b2028; }
.pr-con .h { font-size: 11.5px; color: #8b96a5; margin-bottom: 6px; display: flex; justify-content: space-between; }
.pr-con pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: inherit; }
.pr-con .idle { color: #8b96a5; }
.pr-con .inp { color: #8fb0ff; }
.pr-con .err .raw { color: #ff8f80; }
.pr-con .err .ko { color: #ffd0c9; font-family: var(--sans); margin-top: 4px; }
.pr-con .tip { font-family: var(--sans); color: #e8c47e; margin-top: 8px; font-size: 14px; }
.pr-con .psum { font: 700 22px var(--mono); margin: 2px 0 10px; color: #ff8f80; }
.pr-con .psum.ok { color: #6fd49a; }
.pr-con .row { display: flex; gap: 8px; font-family: var(--sans); font-size: 14px; padding: 4px 0; }
.pr-con .row .mk { font-family: var(--mono); width: 14px; }
.pr-con .row.ok .mk { color: #6fd49a; } .pr-con .row.bad .mk { color: #ff8f80; }
.pr-con .cmp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 2px 0 10px 22px; }
.pr-con .cmp div { background: #171c24; border-radius: 6px; padding: 6px 8px; min-width: 0; }
.pr-con .cmp small { display: block; font: 600 11px var(--sans); color: #8b96a5; margin-bottom: 2px; }
.pr-con .cmp .mine { box-shadow: inset 0 0 0 1px #ff8f8066; }
.pr-con .soft { font-family: var(--sans); background: #13261c; border-radius: 8px; padding: 10px 12px; margin-top: 10px; color: #cfe9d9; }
.pr-con .soft b { color: #6fd49a; display: block; margin-bottom: 6px; }
.pr-con .soft table { font-size: 13.5px; }
.pr-con .soft td { border: 0; padding: 3px 10px 3px 0; background: none !important; color: inherit; }
.pr-con .soft td:first-child { color: #8fb0ff; white-space: nowrap; font-weight: 600; }
.pr-con .soft code { font-family: var(--mono); background: #0e1116; padding: 1px 5px; border-radius: 4px; }
.pr-con .clear { font-family: var(--sans); font-weight: 700; color: #6fd49a; font-size: 16px; margin-top: 8px; }
.ph-ch { margin: 0 0 22px; }
.ph-ch h2 { font-size: 16.5px; margin: 0 0 6px; }
.ph-row { display: flex; gap: 12px; align-items: center; width: 100%; padding: 10px 6px; border: 0; border-bottom: 1px solid var(--line); background: none; cursor: pointer; text-align: left; }
.ph-row:hover { background: var(--bg2); }
.ph-row .mk { font: 700 13px var(--mono); width: 20px; color: var(--faint); flex: none; }
.ph-row.clr .mk { color: var(--ok); }
.ph-row .t { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; }
.ph-row .t small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
@media (max-width: 640px) {
  .pr-editor { font-size: 12.5px; }
  .pr-editor .g { width: 28px; padding-right: 8px; }
  .pr-bar button { flex: 1 1 auto; padding: 0 10px; font-size: 13.5px; }
  .pr-bar .sp { display: none; }
  .pr-con .cmp { grid-template-columns: 1fr; margin-left: 0; }
}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <button class="menu-btn" id="menuBtn" aria-label="목차 열기">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="brand"><b>C++ 시험 노트</b><span>1~7회차</span></div>
    <div class="progress">
      <div class="strip" id="strip" aria-label="파트별 진행"></div>
      <div class="pct" id="pct"></div>
    </div>
    <div class="search" id="searchBox">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="키워드로 찾기" autocomplete="off" aria-label="노트 검색">
      <kbd>/</kbd>
      <div class="results" id="results" role="listbox"></div>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="밝은 화면/어두운 화면 바꾸기"></button>
  </div>

{"id": "p2-13", "title": "잘못된 입력 처리 · assert", "ch": "Ch 9.5~9.6", "sum": "입력이 실패하면 **`clear()` 로 깃발 내리고 → `ignore()` 로 남은 쓰레기 치우기**. assert 는 실행 중, static_assert 는 컴파일할 때 검사.", "key": ["입력 실패 → `clear()` 후 `ignore(max, '\\n')`", "assert 는 Release 에서 사라짐, static_assert 는 컴파일 타임", "assert 안에 부작용 금지"], "blocks": [
{"t": "ana", "x": "🚩 cin 이 실패하면 빨간 깃발을 들고 파업. clear 로 깃발을 내리고, ignore 로 바닥 쓰레기를 치워야 다시 일함."},
{"t": "h", "x": "과제 단골 패턴"},
{"t": "code", "x": "int getInt()\n{\n    while (true)\n    {\n        int x {};\n        std::cin >> x;\n        if (!std::cin)                     // 숫자 대신 문자를 넣었다면\n        {\n            std::cin.clear();              // ① 실패 깃발 내리기\n            std::cin.ignore(std::numeric_limits<std::streamsize>::max(), '\\n');  // ② 줄 버리기\n            continue;\n        }\n        std::cin.ignore(std::numeric_limits<std::streamsize>::max(), '\\n');      // ③ 남은 것 버리기\n        return x;\n    }\n}"},
{"t": "tbl", "h": ["빼먹으면", "생기는 일"], "r": [["① `clear()`", "이후 입력이 전부 무시 → **무한 루프**"], ["② `ignore()`", "같은 쓰레기를 또 읽어 또 실패 → **무한 루프**"], ["③ 성공 후 `ignore()`", "`\"12abc\"` → 12 만 읽고 abc 가 다음 입력에 딸려 감"]]},
{"t": "h", "x": "assert vs static_assert"},
{"t": "code", "x": "assert(b != 0 && \"0 으로 나눌 수 없음\");                 // 실행 중 검사\nstatic_assert(sizeof(int) == 4, \"32비트 int 가정\");    // 컴파일할 때 검사"},

{"t": "code", "x": "void selectionSort(std::vector<int>& v)\n{\n    for (std::size_t i { 0 }; i + 1 < v.size(); ++i)\n    {\n        std::size_t minIdx { i };                       // 남은 것 중 최소 위치\n        for (std::size_t j { i + 1 }; j < v.size(); ++j)\n            if (v[j] < v[minIdx]) minIdx = j;\n        std::swap(v[i], v[minIdx]);                     // 앞으로 보냄\n    }\n}"},
{"t": "fix", "x": "PPT 에 선택 정렬 설명만 있고 코드가 없어 보충함 (`i + 1 < v.size()` 로 부호 함정 회피)."},

{"id": "p7-7", "title": "캡처: 바깥 변수 쓰기", "ch": "Ch 20.7", "sum": "**`[x]` = 값 복사**(만든 순간 값 고정), **`[&x]` = 참조**(원본을 따라감). 쓰는 것만 하나씩 적자.", "key": ["`[x]` 값 캡처 = 만든 순간 고정", "`[&x]` 참조 캡처 = 원본 따라감, 고칠 때", "하나씩 명시"], "blocks": [
{"t": "ana", "x": "📷 `[x]` = 만든 순간 찍은 **사진**, `[&x]` = 실시간 **CCTV**."},
{"t": "h", "x": "값 vs 참조"},
{"t": "code", "x": "int n { 10 };\nauto byValue = [n]()  { return n; };    // 사진\nauto byRef   = [&n]() { return n; };    // CCTV\nn = 99;"},
{"t": "tbl", "h": ["캡처", "n = 99 로 바꾼 뒤 호출", "이유"], "r": [["`[n]`", "**10**", "만든 순간 값이 복사됨"], ["`[&n]`", "**99**", "원본을 봄"]]},
{"t": "h", "x": "언제 뭘 쓰나"},
{"t": "code", "x": "int cut { 85 };\nstd::count_if(v.begin(), v.end(), [cut](int x){ return x >= cut; });   // 읽기만 → 값\n\nint count { 0 };\nauto tick = [&count]() { ++count; };   // 고쳐야 함 → 참조\ntick(); tick(); tick();                // count == 3"},
{"t": "tbl", "h": ["쓰는 법", "뜻", "추천"], "r": [["`[ ]`", "바깥 변수 못 씀", "✅ 대부분 이걸로 충분"], ["`[cut]` `[&count]`", "쓰는 것만 하나씩", "✅ 권장"], ["`[=]` / `[&]`", "전부 값 / 전부 참조", "⚠️ 뭘 가져오는지 안 보임"]]},
{"t": "trap", "x": [["람다 안에서 바깥 변수를 고치려고 `[count]`", "`[&count]`", "값 캡처는 사본이라 원본이 안 바뀜"], ["`[&]` 로 몽땅 캡처", "쓰는 것만 `[cut]`", "무엇을 가져오는지 안 보임"]]},

{"id": "p7-8", "title": "내 클래스를 정렬하기", "ch": "Ch 18.3, 20.6", "sum": "Student 는 그냥 sort 가 안 된다 (`operator<` 없음). 방법 3가지 — **operator< · 비교 함수 · 람다**.", "key": ["사용자 타입 sort → operator< / 비교 함수 / 람다", "기본 순서 operator<, 여러 기준 함수, 일회용 람다", "max_element + 내림차순 비교 = 최솟값"], "blocks": [
{"t": "ana", "x": "🏅 줄 세우기 기준표. 기본 기준(operator<)을 정해 두거나, 그때그때 기준표(비교 함수·람다)를 건네줌."},
{"t": "h", "x": "그냥은 안 됨"},
{"t": "code", "x": "std::vector<Student> v { {\"홍길동\",92}, {\"김철수\",78}, {\"이영희\",85} };\nstd::sort(v.begin(), v.end());   // ❌"},
{"t": "out", "x": "error: no match for 'operator<' (operand types are 'Student' and 'Student')", "cap": "GCC 13 실제 출력 (78줄 중 핵심 1줄)"},
{"t": "tip", "x": "템플릿 오류가 길어도 **“no match for”** 줄 하나만 찾으면 됨."},
{"t": "h", "x": "방법 3가지"},
{"t": "code", "x": "// ① operator< — 기본 순서 (클래스 안)\nbool operator<(const Student& o) const { return m_score < o.m_score; }\nstd::sort(v.begin(), v.end());\n\n// ② 비교 함수 — 기준이 여러 개일 때\nbool byScoreDesc(const Student& a, const Student& b) { return a.score() > b.score(); }\nstd::sort(v.begin(), v.end(), byScoreDesc);\n\n// ③ 람다 — 한 번만 쓸 기준\nstd::sort(v.begin(), v.end(), [](const Student& a, const Student& b) { return a.name() < b.name(); });"},

{"id": "m2-1", "part": "p2-3", "title": "공백 있는 이름 받기", "goal": "“홍 길동” 처럼 공백이 있는 이름을 한 줄 전체로 읽으세요. (std::ws 포함)", "code": "#include <iostream>\n#include <string>\n\nint main()\n{\n    std::string name {};\n    std::cout << \"이름: \";\n    ⟦1⟧                                  // 한 줄 전체 읽기\n    std::cout << name << \"님 안녕하세요\\n\";\n    return 0;\n}", "blanks": [{"ans": "std::getline(std::cin >> std::ws, name);", "accept": ["re:^(std::)?getline\\(std::cin>>std::ws,name\\);$"], "wrong": [{"p": "std::cin>>name;", "outs": ["이름: 홍님 안녕하세요", null], "note": "`cin >>` 은 공백에서 끊겨요. “길동” 은 버퍼에 남아요."}, {"p": "re:^(std::)?getline\\(std::cin,name\\);$", "soft": true, "note": "지금은 앞에 다른 입력이 없어서 괜찮지만, 앞에서 `cin >>` 을 썼다면 남은 개행 때문에 빈 줄이 읽혀요. `std::ws` 까지 세트로."}], "ln": 8}], "tests": [{"name": "공백 있는 이름", "inp": "홍 길동", "out": "이름: 홍 길동님 안녕하세요"}, {"name": "공백 없는 이름", "inp": "김철수", "out": "이름: 김철수님 안녕하세요"}, {"name": "조건: std::ws 로 남은 개행 정리", "cond": [0]}], "hints": ["`cin >>` 은 띄어쓰기에서 끊겨요. 한 줄 전체를 읽는 함수가 있어요.", "`std::getline(입력, 변수)` — 입력 자리에 `std::cin >> std::ws`.", "`std::getline(std::cin >> std::ws, name);`"]},
{"id": "m2-2", "part": "p2-13", "title": "잘못된 입력에서 살아남기", "goal": "숫자 대신 문자가 들어와도 무한 반복 없이 다시 입력받게 두 줄을 채우세요.", "code": "#include <iostream>\n#include <limits>\n\nint main()\n{\n    int x {};\n    while (true)\n    {\n        std::cout << \"정수: \";\n        std::cin >> x;\n        if (!std::cin)\n        {\n            ⟦1⟧          // ① 실패 상태 지우기\n            ⟦2⟧          // ② 남은 줄 버리기\n            std::cout << \"숫자가 아니에요\\n\";\n            continue;\n        }\n        break;\n    }\n    std::cout << x << '\\n';\n    return 0;\n}", "blanks": [{"ans": "std::cin.clear();", "accept": ["std::cin.clear();"], "wrong": [{"p": "", "outs": ["정수: 숫자가 아니에요\n정수: 숫자가 아니에요\n정수: 숫자가 아니에요\n… (무한 반복 — 멈추지 않아요)", null], "note": "clear 를 안 하면 cin 이 실패 상태로 남아 이후 입력을 전부 무시해요."}, {"p": "re:^std::cin\\.ignore\\(.*\\);$", "outs": ["정수: 숫자가 아니에요\n정수: 숫자가 아니에요\n정수: 숫자가 아니에요\n… (무한 반복 — 멈추지 않아요)", null], "note": "순서가 반대예요. 실패 상태에선 ignore 도 안 먹혀요 — clear 먼저."}], "ln": 13}, {"ans": "std::cin.ignore(std::numeric_limits<std::streamsize>::max(), '\\n');", "accept": ["std::cin.ignore(std::numeric_limits<std::streamsize>::max(),'\\n');"], "wrong": [{"p": "", "outs": ["정수: 숫자가 아니에요\n정수: 숫자가 아니에요\n정수: 숫자가 아니에요\n… (무한 반복 — 멈추지 않아요)", null], "note": "ignore 를 안 하면 버퍼에 남은 “abc” 를 다시 읽고 또 실패해요."}, {"p": "std::cin.clear();", "outs": ["정수: 숫자가 아니에요\n정수: 숫자가 아니에요\n정수: 숫자가 아니에요\n… (무한 반복 — 멈추지 않아요)", null], "note": "clear 는 ① 에 한 번이면 돼요. ② 에선 남은 글자를 버려야 해요."}, {"p": "re:^std::cin\\.ignore\\(\\d+,'\\\\n'\\);$", "soft": true, "note": "숫자를 직접 쓰면 그보다 긴 입력에서 실패할 수 있어요. `numeric_limits<std::streamsize>::max()` 가 정석."}], "ln": 14}], "tests": [{"name": "문자 입력 후 숫자", "inp": "abc\n42", "out": "정수: 숫자가 아니에요\n정수: 42"}, {"name": "바로 숫자", "inp": "7", "out": "정수: 7"}, {"name": "조건: max() 까지 버리기", "cond": [1]}], "hints": ["cin 이 실패하면 빨간 깃발을 들고 멈춰요. 깃발을 내리고 쓰레기를 치워야 해요.", "깃발 내리기 = `std::cin.clear();`, 쓰레기 치우기 = `std::cin.ignore(…, '\\n');`", "② `std::cin.ignore(std::numeric_limits<std::streamsize>::max(), '\\n');`"]},
{"id": "m2-3", "part": "p2-6", "title": "음수도 맞는 홀수 판정", "goal": "음수가 들어와도 홀수를 정확히 판정하는 조건을 쓰세요.", "code": "#include <iostream>\n\nbool isOdd(int x)\n{\n    return ⟦1⟧;\n}\n\nint main()\n{\n    int x {};\n    std::cin >> x;\n    std::cout << std::boolalpha << isOdd(x) << '\\n';\n    return 0;\n}", "blanks": [{"ans": "x % 2 != 0", "accept": ["x%2!=0", "(x%2)!=0", "x%2", "0!=x%2"], "wrong": [{"p": "x%2==1", "outs": [null, "false", null, null], "note": "-3 % 2 는 -1 이라서 == 1 이 실패해요."}, {"p": "x%2==0", "outs": ["false", "false", "true", "true"], "note": "이건 짝수 판정이에요."}, {"p": "x/2==1", "outs": ["true", "false", "true", "false"]}], "ln": 5}], "tests": [{"name": "3 → true", "inp": "3", "out": "true"}, {"name": "-3 → true", "inp": "-3", "out": "true"}, {"name": "4 → false", "inp": "4", "out": "false"}, {"name": "0 → false", "inp": "0", "out": "false"}], "hints": ["나머지 연산자 % 를 써요. 그런데 음수의 나머지는 음수예요.", "`-3 % 2` 는 -1. 그래서 “1 과 같다” 대신 “0 이 아니다”로.", "`x % 2 != 0`"]},
{"id": "m2-4", "part": "p2-10", "title": "switch 흘러내림 막기", "goal": "A 를 넣으면 “우수” 만 나오도록 빈칸을 채우세요.", "code": "#include <iostream>\n\nint main()\n{\n    char g {};\n    std::cin >> g;\n    switch (g)\n    {\n        case 'A':\n            std::cout << \"우수\\n\";\n            ⟦1⟧\n        case 'B':\n            std::cout << \"보통\\n\";\n            break;\n        default:\n            std::cout << \"기타\\n\";\n            break;\n    }\n    return 0;\n}", "blanks": [{"ans": "break;", "accept": ["break;"], "wrong": [{"p": "", "outs": ["우수\n보통", null, null], "note": "break 가 없으면 아래 case 로 흘러내려요 (오류가 아니라 컴파일러가 안 막아요)."}, {"p": "[[fallthrough]];", "outs": ["우수\n보통", null, null], "note": "`[[fallthrough]]` 는 “일부러 흘려보낸다”는 표시예요. 멈추려면 break."}, {"p": "continue;", "err": {"raw": "error: continue statement not within a loop", "ko": "11번째 줄: continue 는 반복문 안에서만 — switch 를 끝내려면 break"}}], "ln": 11}], "tests": [{"name": "A → 우수", "inp": "A", "out": "우수"}, {"name": "B → 보통", "inp": "B", "out": "보통"}, {"name": "C → 기타", "inp": "C", "out": "기타"}], "hints": ["A 를 넣으면 지금은 “보통” 까지 같이 나와요. 왜 아래로 내려갈까요?", "case 끝을 막는 한 단어 + 세미콜론.", "`break;`"]},
{"id": "m3-1", "part": "p3-6", "title": "참조로 원본 바꾸기", "goal": "addBonus 가 호출한 쪽의 s 를 직접 5 올리도록 매개변수 타입을 정하세요.", "code": "#include <iostream>\n\nvoid addBonus(⟦1⟧ score)\n{\n    score += 5;\n}\n\nint main()\n{\n    int s { 90 };\n    addBonus(s);\n    std::cout << s << '\\n';\n    return 0;\n}", "blanks": [{"ans": "int&", "accept": ["int&", "auto&"], "wrong": [{"p": "int", "out": "90", "note": "값으로 받으면 복사본만 바뀌고 원본 s 는 그대로예요."}, {"p": "auto", "out": "90", "note": "값으로 받으면 복사본만 바뀌어요."}, {"p": "const int&", "err": {"raw": "error: assignment of read-only reference 'score'", "ko": "5번째 줄: const 참조는 값을 못 바꿔요"}}, {"p": "int*", "err": {"raw": "error: invalid conversion from 'int' to 'int*' [-fpermissive]", "ko": "11번째 줄: 포인터로 받으면 `addBonus(&s)` 로 넘기고 안에서 `*score` 를 써야 해요"}}], "ln": 3}], "tests": [{"name": "출력이 95", "out": "95"}], "hints": ["지금 매개변수는 복사본이라 원본이 안 바뀌어요.", "원본의 “다른 이름”을 받는 방법 — 타입 뒤에 기호 하나.", "`int&`"]},
{"id": "m3-2", "part": "p3-7", "title": "널 검사하고 포인터 따라가기", "goal": "널이면 그냥 돌아가고, 아니면 가리키는 값을 100 으로 바꾸세요.", "code": "#include <iostream>\n\nvoid update(int* p)\n{\n    if (⟦1⟧) return;    // 널이면 그냥 돌아가기\n    ⟦2⟧ = 100;          // 가리키는 값을 100 으로\n}\n\nint main()\n{\n    int x { 5 };\n    update(&x);\n    update(nullptr);\n    std::cout << x << '\\n';\n    return 0;\n}", "blanks": [{"ans": "!p", "accept": ["!p", "p==nullptr", "nullptr==p"], "wrong": [{"p": "p", "out": "Segmentation fault (core dumped)\n→ 널 포인터를 따라가서 멈췄어요", "note": "거꾸로예요. 널이 아닐 때 돌아가고, 널일 때 *p 를 해 버려요."}, {"p": "p!=nullptr", "out": "Segmentation fault (core dumped)\n→ 널 포인터를 따라가서 멈췄어요", "note": "거꾸로예요. 널일 때 돌아가야 해요."}, {"p": "p==NULL", "soft": true, "note": "C++ 에선 NULL 대신 nullptr."}, {"p": "p==0", "soft": true, "note": "0 대신 nullptr 가 의도를 분명히 보여 줘요."}], "ln": 5}, {"ans": "*p", "accept": ["*p"], "wrong": [{"p": "p", "err": {"raw": "error: invalid conversion from 'int' to 'int*' [-fpermissive]", "ko": "6번째 줄: p 는 주소예요. 가리키는 값을 바꾸려면 *p"}}, {"p": "&p", "err": {"raw": "error: lvalue required as left operand of assignment", "ko": "6번째 줄: &p 는 p 자신의 주소라 대입할 수 없어요 — *p"}}], "ln": 6}], "tests": [{"name": "출력이 100 (그리고 멈추지 않음)", "out": "100"}], "hints": ["포인터가 비었는지 먼저 보고, 비어 있지 않을 때만 따라가요.", "“널이면” = `!p` 또는 `p == nullptr`. 따라가기 = `*`.", "① `!p`  ② `*p`"]},
{"id": "m3-3", "part": "p3-9", "title": "enum class 쓰고 숫자로 보기", "goal": "c 를 green 으로 만들고, c 의 정수 값을 출력하세요.", "code": "#include <iostream>\n\nenum class Color { red, green, blue };\n\nint main()\n{\n    Color c { ⟦1⟧ };                 // green 으로\n    std::cout << ⟦2⟧ << '\\n';        // c 의 정수 값 출력\n    return 0;\n}", "blanks": [{"ans": "Color::green", "accept": ["Color::green"], "wrong": [{"p": "green", "err": {"raw": "error: 'green' was not declared in this scope", "ko": "7번째 줄: enum class 는 `Color::` 를 붙여야 해요"}}, {"p": "1", "err": {"raw": "error: cannot convert 'int' to 'Color' in initialization", "ko": "7번째 줄: enum class 는 정수에서 자동으로 안 바뀌어요"}}, {"p": "Color::red", "out": "0"}, {"p": "Color::blue", "out": "2"}], "ln": 7}, {"ans": "static_cast<int>(c)", "accept": ["static_cast<int>(c)"], "wrong": [{"p": "c", "err": {"raw": "error: no match for 'operator<<' (operand types are 'std::ostream' and 'Color')", "ko": "8번째 줄: enum class 는 정수로 자동 변환이 안 돼서 바로 출력 못 해요"}}, {"p": "(int)c", "soft": true, "note": "C 스타일 캐스트 대신 `static_cast<int>(c)`."}, {"p": "int(c)", "soft": true, "note": "`static_cast<int>(c)` 가 변환을 더 분명히 보여 줘요."}], "ln": 8}], "tests": [{"name": "출력이 1", "out": "1"}, {"name": "조건: static_cast 로 변환", "cond": [1]}], "hints": ["enum class 는 이름이 밖으로 새지 않아요. 앞에 무언가를 붙여야 해요.", "`Color::이름`. 정수로 보려면 `static_cast<int>(…)`.", "① `Color::green`  ② `static_cast<int>(c)`"]},
{"id": "m3-4", "part": "p3-10", "title": "포인터로 struct 멤버 읽기", "goal": "포인터 p 를 써서 직원 이름을 출력하세요.", "code": "#include <iostream>\n#include <string>\n\nstruct Employee\n{\n    int id {};\n    std::string name {};\n};\n\nint main()\n{\n    Employee e { 1, \"홍길동\" };\n    Employee* p { &e };\n    std::cout << ⟦1⟧ << '\\n';    // 포인터 p 로 이름 출력\n    return 0;\n}", "blanks": [{"ans": "p->name", "accept": ["p->name"], "wrong": [{"p": "p.name", "err": {"raw": "error: request for member 'name' in 'p', which is of pointer type 'Employee*' (maybe you meant to use '->' ?)", "ko": "14번째 줄: p 는 포인터라서 . 대신 -> 를 써요"}}, {"p": "*p.name", "err": {"raw": "error: request for member 'name' in 'p', which is of pointer type 'Employee*' (maybe you meant to use '->' ?)", "ko": "14번째 줄: . 이 * 보다 먼저 묶여요 — (*p).name 이나 p->name"}}, {"p": "(*p).name", "soft": true, "note": "맞는 코드예요! 같은 뜻인 `p->name` 이 더 짧고 흔해요."}, {"p": "e.name", "soft": true, "note": "맞는 값이지만 미션은 포인터 p 로 접근하기예요."}], "ln": 14}], "tests": [{"name": "출력이 홍길동", "out": "홍길동"}, {"name": "조건: p-> 로 접근", "cond": [0]}], "hints": ["p 는 객체가 아니라 주소예요.", "포인터가 가리키는 객체의 멤버 = 화살표.", "`p->name`"]},
{"id": "m4-1", "part": "p4-6", "title": "멤버 초기화 리스트", "goal": "생성자에서 초기화 리스트로 m_name 과 m_score 를 채우세요.", "code": "#include <iostream>\n#include <string>\n#include <string_view>\n\nclass Student {\n    std::string m_name {};\n    int m_score {};\npublic:\n    Student(std::string_view n, int s)\n        ⟦1⟧          // 초기화 리스트\n    { }\n    void print() const { std::cout << m_name << \" (\" << m_score << \"점)\\n\"; }\n};\n\nint main()\n{\n    Student a { \"홍길동\", 90 };\n    a.print();\n    return 0;\n}", "blanks": [{"ans": ": m_name { n }, m_score { s }", "accept": [":m_name{n},m_score{s}"], "wrong": [{"p": "", "out": " (0점)", "note": "초기화 리스트가 비면 멤버는 기본값(빈 문자열, 0) 그대로예요."}, {"p": "m_name{n},m_score{s}", "err": {"raw": "error: expected '{' before 'm_name'", "ko": "10번째 줄: 초기화 리스트는 콜론(:)으로 시작해요"}}, {"p": ":m_name=n,m_score=s", "err": {"raw": "error: expected '(' or '{' before '=' token", "ko": "10번째 줄: 초기화 리스트는 = 가 아니라 { } 로"}}, {"p": ":m_name(n),m_score(s)", "soft": true, "note": "`( )` 도 되지만, 이 과정에선 `{ }` 를 권장해요."}, {"p": ":m_score{s},m_name{n}", "soft": true, "note": "멤버 선언 순서(m_name → m_score)대로 쓰는 게 좋아요. 순서가 다르면 -Wreorder 경고."}], "ln": 10}], "tests": [{"name": "출력이 홍길동 (90점)", "out": "홍길동 (90점)"}, {"name": "조건: : 멤버 { 값 } 형태", "cond": [0]}], "hints": ["생성자 괄호와 본문 { } 사이에 쓰는 목록이에요.", "`: 멤버 { 값 }, 멤버 { 값 }` — 콜론으로 시작, 쉼표로 나열.", "`: m_name { n }, m_score { s }`"]},
{"id": "m4-2", "part": "p4-6", "title": "사라진 기본 생성자 되살리기", "goal": "`Student a {};` 가 컴파일되도록 기본 생성자를 되살리세요.", "code": "#include <iostream>\n#include <string>\n#include <string_view>\n\nclass Student {\n    std::string m_name {};\n    int m_score {};\npublic:\n    ⟦1⟧                                    // 인자 없이도 만들 수 있게\n    Student(std::string_view n, int s) : m_name { n }, m_score { s } { }\n    int getScore() const { return m_score; }\n};\n\nint main()\n{\n    Student a {};\n    Student b { \"홍길동\", 90 };\n    std::cout << a.getScore() << ' ' << b.getScore() << '\\n';\n    return 0;\n}", "blanks": [{"ans": "Student() = default;", "accept": ["Student()=default;"], "wrong": [{"p": "", "err": {"raw": "error: no matching function for call to 'Student::Student(<brace-enclosed initializer list>)'", "ko": "16;}번째 줄: 생성자를 직접 만들면 기본 생성자가 사라져요"}}, {"p": "void Student()=default;", "err": {"raw": "error: return type specification for constructor invalid", "ko": "9번째 줄: 생성자엔 반환형이 없어요"}}, {"p": "Student(){}", "soft": true, "note": "맞게 동작해요! `= default;` 가 “컴파일러 기본 그대로”라는 의도를 더 잘 보여 줘요."}], "ln": 9}], "tests": [{"name": "출력이 0 90", "out": "0 90"}, {"name": "조건: = default 사용", "cond": [0]}], "hints": ["생성자를 하나라도 만들면 컴파일러가 공짜 기본 생성자를 거둬 가요.", "인자 없는 생성자를 “기본 그대로” 달라고 하는 문법이 있어요.", "`Student() = default;`"]},
{"id": "m4-3", "part": "p4-7", "title": "setter 에서 0~100 검사", "goal": "0~100 밖의 값이면 무시하도록 조건을 쓰세요. (경계값 0, 100 은 허용)", "code": "#include <iostream>\n\nclass Student {\n    int m_score {};\npublic:\n    void setScore(int v)\n    {\n        if (⟦1⟧) return;     // 0~100 밖이면 무시\n        m_score = v;\n    }\n    int getScore() const { return m_score; }\n};\n\nint main()\n{\n    Student a {};\n    a.setScore(50);\n    int v {};\n    std::cin >> v;\n    a.setScore(v);\n    std::cout << a.getScore() << '\\n';\n    return 0;\n}", "blanks": [{"ans": "v < 0 || v > 100", "accept": ["v<0||v>100", "v>100||v<0", "v<0||100<v", "100<v||v<0", "!(v>=0&&v<=100)", "0>v||v>100"], "wrong": [{"p": "v<0&&v>100", "outs": [null, "-5", "150", null, null], "note": "&& 면 “0보다 작고 동시에 100보다 큰” 수 — 그런 수는 없어요. 그래서 하나도 안 막아요."}, {"p": "v<=0||v>=100", "outs": [null, null, null, "50", "50"], "note": "경계값 0 과 100 까지 막아 버려요. <, > 로."}, {"p": "v<0", "outs": [null, null, "150", null, null], "note": "100 보다 큰 쪽도 막아야 해요."}, {"p": "v>100", "outs": [null, "-5", null, null, null], "note": "0 보다 작은 쪽도 막아야 해요."}, {"p": "v>=0&&v<=100", "outs": ["50", "-5", "150", "50", "50"], "note": "거꾸로예요 — 정상 값을 막고 이상한 값을 통과시켜요."}], "ln": 8}], "tests": [{"name": "90 → 90", "inp": "90", "out": "90"}, {"name": "-5 → 무시 (50 유지)", "inp": "-5", "out": "50"}, {"name": "150 → 무시 (50 유지)", "inp": "150", "out": "50"}, {"name": "경계 100 → 100", "inp": "100", "out": "100"}, {"name": "경계 0 → 0", "inp": "0", "out": "0"}], "hints": ["“밖이면” = 0 보다 작거나, 100 보다 크거나.", "“또는” 은 `||`. 0 과 100 은 허용이니 `<`, `>` 로.", "`v < 0 || v > 100`"]},
{"id": "m4-4", "part": "p4-9", "title": "const 멤버 함수", "goal": "const& 로 받은 객체에서도 getScore 를 부를 수 있게 하세요.", "code": "#include <iostream>\n\nclass Student {\n    int m_score { 90 };\npublic:\n    int getScore() ⟦1⟧ { return m_score; }\n};\n\nvoid report(const Student& s)\n{\n    std::cout << s.getScore() << '\\n';\n}\n\nint main()\n{\n    Student a {};\n    report(a);\n    return 0;\n}", "blanks": [{"ans": "const", "accept": ["const"], "wrong": [{"p": "", "err": {"raw": "error: passing 'const Student' as 'this' argument discards qualifiers [-fpermissive]", "ko": "11번째 줄: const& 로 받은 객체에선 const 멤버 함수만 부를 수 있어요"}}, {"p": "static", "err": {"raw": "error: expected ';' at end of member declaration", "ko": "6번째 줄: 괄호 뒤엔 const 가 와요"}}], "ln": 6}], "tests": [{"name": "출력이 90", "out": "90"}], "hints": ["report 는 s 를 const& 로 받아요. 그 안에선 “안 바꾸겠다”고 약속한 함수만 불러요.", "약속 표시는 괄호 닫고 바로 뒤에 한 단어.", "`const`"]},
{"id": "m5-1", "part": "p5-2", "title": "this 로 멤버 구분하기", "goal": "매개변수와 이름이 같은 멤버에 값이 들어가도록 고치세요.", "code": "#include <iostream>\n#include <string>\n#include <string_view>\n\nclass Student {\n    std::string name {};\n    int score {};\npublic:\n    void setAll(std::string_view name, int score)\n    {\n        ⟦1⟧ = name;\n        ⟦2⟧ = score;\n    }\n    void print() const { std::cout << name << \" (\" << score << \"점)\\n\"; }\n};\n\nint main()\n{\n    Student a {};\n    a.setAll(\"홍길동\", 90);\n    a.print();\n    return 0;\n}", "blanks": [{"ans": "this->name", "accept": ["this->name"], "wrong": [{"p": "name", "tag": "n", "note": "`name = name;` 은 매개변수가 자기 자신에게 대입될 뿐이에요. 오류도 안 나요."}, {"p": "this.name", "err": {"raw": "error: request for member 'name' in '(Student*)this', which is of pointer type 'Student*' (maybe you meant to use '->' ?)", "ko": "11번째 줄: this 는 포인터라서 . 대신 ->"}}, {"p": "(*this).name", "soft": true, "note": "맞는 코드예요! 같은 뜻인 `this->name` 이 더 흔해요."}], "ln": 11}, {"ans": "this->score", "accept": ["this->score"], "wrong": [{"p": "score", "tag": "s", "note": "`score = score;` 도 자기 자신에게 대입이라 멤버는 그대로예요."}, {"p": "this.score", "err": {"raw": "error: request for member 'score' in '(Student*)this', which is of pointer type 'Student*' (maybe you meant to use '->' ?)", "ko": "12번째 줄: this 는 포인터라서 . 대신 ->"}}, {"p": "(*this).score", "soft": true, "note": "맞는 코드예요! 같은 뜻인 `this->score` 가 더 흔해요."}], "ln": 12}], "combos": {"n": [" (90점)"], "s": ["홍길동 (0점)"], "n+s": [" (0점)"]}, "tests": [{"name": "출력이 홍길동 (90점)", "out": "홍길동 (90점)"}], "hints": ["안에서 그냥 `name` 이라고 쓰면 매개변수 name 이 먼저 잡혀요.", "“이 객체의” name = 부른 객체를 가리키는 포인터 + `->`.", "① `this->name`  ② `this->score`"]},
{"id": "m5-2", "part": "p5-3", "title": "소멸자 만들기", "goal": "객체가 사라질 때 “○○ 소멸” 이 찍히도록 소멸자를 선언하세요.", "code": "#include <iostream>\n#include <string>\n#include <string_view>\n\nclass Guard {\n    std::string m_name {};\npublic:\n    Guard(std::string_view n) : m_name { n } { std::cout << m_name << \" 생성\\n\"; }\n    ⟦1⟧ { std::cout << m_name << \" 소멸\\n\"; }     // 소멸자\n};\n\nint main()\n{\n    Guard a { \"첫째\" };\n    { Guard b { \"둘째\" }; }\n    std::cout << \"끝\\n\";\n    return 0;\n}", "blanks": [{"ans": "~Guard()", "accept": ["~Guard()"], "wrong": [{"p": "Guard()", "out": "첫째 생성\n둘째 생성\n끝", "note": "`Guard()` 는 또 하나의 (기본) 생성자예요. 소멸자는 앞에 `~`."}, {"p": "re:^~Guard\\(.+\\)$", "err": {"raw": "error: destructors may not have parameters", "ko": "9번째 줄: 소멸자는 인자를 못 받아요"}}, {"p": "void ~Guard()", "err": {"raw": "error: return type specification for destructor invalid", "ko": "9번째 줄: 소멸자엔 반환형이 없어요"}}, {"p": "~Guard", "err": {"raw": "error: expected '(' before '{' token", "ko": "9번째 줄: 이름 뒤에 빈 괄호 () 가 필요해요"}}], "ln": 9}], "tests": [{"name": "생성·소멸 순서", "out": "첫째 생성\n둘째 생성\n둘째 소멸\n끝\n첫째 소멸"}], "hints": ["생성자의 짝이에요. 이름은 클래스 이름과 거의 같아요.", "이름 앞에 물결표 `~`, 인자·반환형 없음.", "`~Guard()`"]},
{"id": "m5-3", "part": "p5-6", "title": "학번 자동 부여", "goal": "첫 학생은 20250001, 그다음부터 1씩 늘어나게 빈칸을 채우세요.", "code": "#include <iostream>\n\nclass Student {\n    inline static int s_nextId { 20250001 };\n    int m_id {};\npublic:\n    Student() : m_id { ⟦1⟧ } { }\n    int id() const { return m_id; }\n};\n\nint main()\n{\n    Student a {}, b {}, c {};\n    std::cout << a.id() << ' ' << c.id() << '\\n';\n    return 0;\n}", "blanks": [{"ans": "s_nextId++", "accept": ["s_nextId++"], "wrong": [{"p": "++s_nextId", "out": "20250002 20250004", "note": "전위 ++ 는 먼저 올리고 줘서 첫 학번이 20250002 가 돼요."}, {"p": "s_nextId", "out": "20250001 20250001", "note": "값을 올리지 않아서 모두 같은 학번이에요."}, {"p": "s_nextId+1", "out": "20250002 20250002", "note": "+1 은 s_nextId 자체를 바꾸지 않아요."}, {"p": "s_nextId--", "out": "20250001 20249999"}], "ln": 7}], "tests": [{"name": "a = 20250001, c = 20250003", "out": "20250001 20250003"}], "hints": ["현재 번호를 주고, 다음 사람을 위해 번호를 하나 올려야 해요.", "“주고 나서 올리기” 는 후위 증가.", "`s_nextId++`"]},
{"id": "m5-4", "part": "p5-7", "title": "함수 템플릿 선언", "goal": "larger 가 int·double·string 모두에서 동작하도록 템플릿 선언을 쓰세요.", "code": "#include <iostream>\n#include <string>\n\n⟦1⟧\nT larger(T a, T b)\n{\n    return a > b ? a : b;\n}\n\nint main()\n{\n    std::cout << larger(3, 7) << ' ' << larger(2.5, 1.5) << '\\n';\n    std::cout << larger(std::string { \"홍길동\" }, std::string { \"김철수\" }) << '\\n';\n    return 0;\n}", "blanks": [{"ans": "template <typename T>", "accept": ["template<typename T>", "template<class T>"], "wrong": [{"p": "", "err": {"raw": "error: 'T' does not name a type", "ko": "5번째 줄: T 가 뭔지 몰라요 — 바로 위에 템플릿 선언이 필요해요"}}, {"p": "template<T>", "err": {"raw": "error: 'T' has not been declared", "ko": "4번째 줄: < > 안에 `typename T` 처럼 써야 해요"}}, {"p": "re:^template<(typename|class) T>;$", "err": {"raw": "error: expected unqualified-id before ';' token", "ko": "4번째 줄: 템플릿 선언 뒤엔 ; 를 붙이지 않아요"}}, {"p": "typename T;", "err": {"raw": "error: expected nested-name-specifier before 'T'", "ko": "4번째 줄: 앞에 `template < >` 가 필요해요"}}], "ln": 4}], "tests": [{"name": "출력이 7 2.5 / 홍길동", "out": "7 2.5\n홍길동"}], "hints": ["T 는 “아직 정하지 않은 타입” 이에요. 컴파일러에게 그렇다고 알려 줘야 해요.", "`template < … >` 안에 “T 는 타입 이름” 이라고 쓰기.", "`template <typename T>`"]},
{"id": "m6-1", "part": "p6-2", "title": "{ } 와 ( ) 구분하기", "goal": "a 는 0 이 세 칸, b 는 원소 3 하나짜리 vector 로 만드세요.", "code": "#include <iostream>\n#include <vector>\n\nint main()\n{\n    std::vector<int> a ⟦1⟧;    // 0 이 3칸\n    std::vector<int> b ⟦2⟧;    // 원소 3 하나\n    std::cout << a.size() << ' ' << b.size() << '\\n';\n    return 0;\n}", "blanks": [{"ans": "( 3 )", "accept": ["(3)", "(3,0)"], "wrong": [{"p": "{3}", "tag": "A", "note": "`{3}` 은 “3 이라는 원소 하나” 예요. 칸 수는 `( )`."}, {"p": "[3]", "err": {"raw": "error: request for member 'size' in 'a', which is of non-class type 'std::vector<int> [3]'", "ko": "8번째 줄: `[3]` 은 vector 3개짜리 배열이 돼요 — 칸 수는 ( )"}}], "ln": 6}, {"ans": "{ 3 }", "accept": ["{3}"], "wrong": [{"p": "(3)", "tag": "B", "note": "`(3)` 은 0 이 세 칸이에요. 값 나열은 `{ }`."}], "ln": 7}], "combos": {"A": ["1 1"], "B": ["3 3"], "A+B": ["1 3"]}, "tests": [{"name": "출력이 3 1", "out": "3 1"}], "hints": ["vector 는 괄호 모양에 따라 뜻이 완전히 달라요.", "“몇 칸짜리” 는 소괄호, “값 나열” 은 중괄호.", "① `( 3 )`  ② `{ 3 }`"]},
{"id": "m6-2", "part": "p6-3", "title": "range-for 로 원소 고치기", "goal": "모든 이름 뒤에 “님” 이 붙도록 반복 변수의 타입을 정하세요.", "code": "#include <iostream>\n#include <string>\n#include <vector>\n\nint main()\n{\n    std::vector<std::string> names { \"홍길동\", \"김철수\" };\n    for (⟦1⟧ s : names)\n        s += \"님\";\n    std::cout << names[0] << ' ' << names[1] << '\\n';\n    return 0;\n}", "blanks": [{"ans": "std::string&", "accept": ["std::string&", "auto&"], "wrong": [{"p": "std::string", "out": "홍길동 김철수", "note": "값으로 받으면 복사본에만 “님” 이 붙고 원본은 그대로예요."}, {"p": "auto", "out": "홍길동 김철수", "note": "`auto` 만 쓰면 복사본이에요. 고치려면 `auto&`."}, {"p": "re:^const (std::string|auto)&$", "err": {"raw": "error: no match for 'operator+=' (operand types are 'const std::string' and 'const char [4]')", "ko": "9번째 줄: const 로 받으면 고칠 수 없어요"}}], "ln": 8}], "tests": [{"name": "출력이 홍길동님 김철수님", "out": "홍길동님 김철수님"}], "hints": ["반복 변수가 원소의 복사본이면 원본은 안 바뀌어요.", "원본의 별명으로 받으려면 타입 뒤에 `&`.", "`std::string&` (또는 `auto&`)"]},

<script>
(() => {
'use strict';
const DATA = JSON.parse(document.getElementById('notes-data').textContent);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ── flat part list ── */
const PARTS = [];
DATA.chapters.forEach((c, ci) => c.parts.forEach(p => PARTS.push({ ...p, ci, chapter: c, idx: PARTS.length })));
const BY_ID = Object.fromEntries(PARTS.map(p => [p.id, p]));
const QUIZ = JSON.parse(document.getElementById('quiz-data').textContent);
const QBY = {};
Object.entries(QUIZ).forEach(([pid, arr]) => arr.forEach(q => { q.pid = pid; QBY[q.id] = q; }));
const QTOTAL = Object.keys(QBY).length;
const MISSIONS = JSON.parse(document.getElementById('prac-data').textContent);
const MBY = {}, MBYPART = {};
MISSIONS.forEach((m, i) => { m.idx = i; MBY[m.id] = m; (MBYPART[m.part] = MBYPART[m.part] || []).push(m); });
let CUR_MISSION = null;

/* ── storage (guarded) ── */
const store = {
  get(k, d) { try { const v = localStorage.getItem('cppnote:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('cppnote:' + k, JSON.stringify(v)); } catch {} }
};
const read = new Set(store.get('read', []).filter(id => BY_ID[id]));
const state = { tab: 'notes', part: PARTS[0].id, checkMode: 'stars', pendingCode: null, quiz: null, mission: null, pc: null };
const qres = store.get('qres', {});
Object.keys(qres).forEach(k => { if (!QBY[k]) delete qres[k]; });
const prac = store.get('prac', {});
const pget = id => { const m = MBY[id]; let r = prac[id]; if (!r || !Array.isArray(r.v) || r.v.length !== m.blanks.length) r = prac[id] = { v: m.blanks.map(() => ''), tries: 0, clear: false, hint: 0 }; return r; };
const psave = () => store.set('prac', prac);
const pClearN = () => MISSIONS.filter(m => prac[m.id] && prac[m.id].clear).length;
const wrongIds = () => Object.keys(qres).filter(k => qres[k] === 0);
const qStat = pid => { const a = QUIZ[pid] || []; return { ok: a.filter(q => qres[q.id] === 1).length, tried: a.filter(q => q.id in qres).length, n: a.length }; };

/* ── theme ── */
const themeBtn = $('#themeBtn');
const SUN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.innerHTML = t === 'dark' ? SUN : MOON;
  themeBtn.setAttribute('aria-label', t === 'dark' ? '밝은 화면으로' : '어두운 화면으로');
}
applyTheme(store.get('theme', 'dark'));
themeBtn.onclick = () => { const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; applyTheme(t); store.set('theme', t); };

/* ── inline formatting: `code` and **bold** ── */
function inl(s) {
  return String(s).split('`').map((seg, i) => i % 2
    ? '<code class="ic">' + esc(seg).replace(/\*/g, '&#42;') + '</code>'
    : esc(seg)).join('').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

/* ── C++ highlighter ── */
const KW = new Set(('alignas auto bool break case catch char class const constexpr continue default delete do double else enum explicit extern false float for friend if inline int long namespace new nullptr operator private protected public return short signed sizeof static static_assert static_cast struct switch template this throw true try typedef typename unsigned using virtual void while noexcept size_t').split(' '));
const TOK = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/|"(?:\\.|[^"\\\n])*"[a-z]*|'(?:\\.|[^'\\\n])+'|^[ \t]*#[^\n]*|\b0[xXbB][0-9a-fA-F']+\b|\b\d[\d'.]*(?:e-?\d+)?[a-zA-Z]*\b|\bstd::[\w:]+|\b[A-Za-z_]\w*\b)/gm;
function hl(src) {
  let out = '', last = 0;
  src.replace(TOK, (m, _1, off) => {
    out += esc(src.slice(last, off));
    let cls = '';
    if (m.startsWith('//') || m.startsWith('/*')) cls = 't-com';
    else if (m[0] === '"' || m[0] === "'") cls = 't-str';
    else if (/^[ \t]*#/.test(m)) cls = 't-pre';
    else if (/^\d/.test(m)) cls = 't-num';
    else if (m.startsWith('std::')) cls = 't-ty';
    else if (KW.has(m)) cls = 't-kw';
    else if (/^[A-Z]/.test(m) && m.length > 1) cls = 't-ty';
    out += cls ? '<span class="' + cls + '">' + esc(m) + '</span>' : esc(m);
    last = off + m.length;
    return m;
  });
  return out + esc(src.slice(last));
}

/* ── blocks ── */
const CODES = [];
function codeBlock(src, opts = {}) {
  const id = CODES.push(src) - 1;
  const n = src.split('\n').length;
  const gut = Array.from({ length: n }, (_, i) => i + 1).join('\n');
  const isShell = /^\s*(#\s|g\+\+)/.test(src) && !/#include/.test(src);
  const runnable = /\bmain\s*\(/.test(src) && !opts.noRun && CUR_MISSION;
  return `<div class="code">
    <div class="code-h"><span class="lang">${isShell ? 'shell' : 'C++'}</span>
      <button class="cbtn" data-copy="${id}">복사</button>
      ${runnable ? `<button class="cbtn run" data-mission="${CUR_MISSION}">▶ 실습에서 해 보기</button>` : ''}
    </div>
    <div class="code-b"><pre class="gut" aria-hidden="true">${gut}</pre><pre class="src"><code>${hl(src)}</code></pre></div>
  </div>`;
}
const CO = { star: '⭐ 시험 포인트', warn: '⚠️ 자주 하는 실수', mem: '🧠 외우는 법', tip: '✅ 이렇게 하기', ref: '📎 참고 · 시험 X', fix: '📝 PPT 정정·보충' };
function block(b) {
  switch (b.t) {
    case 'h': return `<h2 class="bh">${inl(b.x)}</h2>`;
    case 'p': return `<p class="bp">${inl(b.x)}</p>`;
    case 'li': return `<ul class="bl">${b.x.map(x => `<li>${inl(x)}</li>`).join('')}</ul>`;
    case 'dl': return `<dl class="bd">${b.x.map(([k, v]) => `<dt>${inl(k)}</dt><dd>${inl(v)}</dd>`).join('')}</dl>`;
    case 'term': return `<div class="term"><span class="tg">용어</span><span class="ko">${inl(b.ko)}</span><span class="en">${esc(b.en)}</span><span class="d">${inl(b.d)}</span></div>`;
    case 'tbl': return `<div class="tw"><table><thead><tr>${b.h.map(h => `<th>${inl(h)}</th>`).join('')}</tr></thead><tbody>${b.r.map(r => `<tr>${r.map(c => `<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'code': return codeBlock(b.x);
    case 'out': return `<div class="out"><div class="out-h">${esc(b.cap || '실행 결과')}</div><pre>${esc(b.x)}</pre></div>`;
    case 'vs': {
      const side = s => `<div class="side-c"><div class="vh">${inl(s.h)}</div>${b.text
        ? `<div class="out"><pre>${esc(s.x)}</pre></div>`
        : codeBlock(s.x, { noRun: true })}${s.n ? `<div class="vn">${inl(s.n)}</div>` : ''}</div>`;
      return `<div class="vs">${side(b.a)}${side(b.b)}</div>`;
    }
    case 'flow': return `<div class="flow">${b.x.map(([a, d]) => `<div class="st"><b>${inl(a)}</b><span>${inl(d)}</span></div>`).join('')}</div>`;
    default:
      if (CO[b.t]) return `<div class="co ${b.t}"><span class="lb">${CO[b.t]}</span>${inl(b.x)}</div>`;
      return '';
  }
}

/* ── sidebar ── */
const side = $('#side');
function renderSide() {
  const cur = BY_ID[state.part];
  side.innerHTML = DATA.chapters.map((c, ci) => {
    const done = c.parts.filter(p => read.has(p.id)).length;
    const open = state.tab === 'notes' ? cur.ci === ci : false;
    return `<div class="ch${open ? ' open' : ''}" data-ci="${ci}">
      <button class="ch-head" aria-expanded="${open}"><svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
        <span>${esc(c.title)}</span><span class="cnt${done === c.parts.length ? ' full' : ''}">${done}/${c.parts.length}</span></button>
      <div class="ch-parts">${c.parts.map(p => `<button class="pl${read.has(p.id) ? ' done' : ''}${p.id === state.part && state.tab === 'notes' ? ' cur' : ''}" data-go="${p.id}"><span class="mk">${read.has(p.id) ? '✓' : '·'}</span><span>${inl(p.title)}</span></button>`).join('')}</div>
    </div>`;
  }).join('');
}
side.addEventListener('click', e => {
  const h = e.target.closest('.ch-head');
  if (h) { const ch = h.parentElement; ch.classList.toggle('open'); h.setAttribute('aria-expanded', ch.classList.contains('open')); return; }
  const g = e.target.closest('[data-go]');
  if (g) { go(g.dataset.go); closeNav(); }
});

/* ── progress strip ── */
const strip = $('#strip');
function renderStrip(pulseId) {
  strip.innerHTML = DATA.chapters.map(c => `<div class="grp" style="--n:${c.parts.length}">${c.parts.map(p =>
    `<button class="seg${read.has(p.id) ? ' done' : ''}${p.id === state.part && state.tab === 'notes' ? ' cur' : ''}${p.id === pulseId ? ' pulse' : ''}" data-go="${p.id}" title="${esc(c.title.split(' · ')[0] + ' · ' + p.title)}" aria-label="${esc(p.title)}"></button>`).join('')}</div>`).join('');
  const pct = Math.round(read.size / PARTS.length * 100);

function norm(x) { return String(x).replace(/\s+/g, ' ').trim().replace(/\s*([()\[\]{};,<>=+\-*/&|!:.?%~])\s*/g, '$1'); }

function evalBlank(m, i, raw) {
  const b = m.blanks[i], n = norm(raw);
  if (b.accept.some(p => matchP(p, n))) return { ok: true };
  const w = b.wrong.find(w => matchP(w.p, n));
  if (w) return w.err ? { err: w.err, w } : { w };
  if (n === '') return { err: { raw: 'error: expected primary-expression', ko: `${b.ln}번째 줄: 빈칸이 비어 있어요` } };
  if (b.ans.trim().endsWith(';') && !n.endsWith(';')) return { err: { raw: "error: expected ';' before '}' token", ko: `${b.ln}번째 줄: 세미콜론(;)이 빠졌어요` } };
  const cnt = ch => n.split(ch).length - 1;
  if (cnt('(') !== cnt(')') || cnt('{') !== cnt('}') || cnt('[') !== cnt(']')) return { err: { raw: "error: expected ')' before ';' token", ko: `${b.ln}번째 줄: 괄호 짝이 안 맞아요` } };
  return { unknown: true };
}
function simulate(m, vals) {
  const st = m.blanks.map((_, i) => evalBlank(m, i, vals[i] || ''));
  const e = st.find(x => x.err);
  if (e) return { st, err: e.err, results: m.tests.map(t => ({ t, pass: false, mine: '(컴파일 오류)' })) };
  const bad = st.map((x, i) => ({ x, i })).filter(o => !o.x.ok && !(o.x.w && o.x.w.soft));
  const unknown = bad.some(o => o.x.unknown);
  let oi = -1;
  const results = m.tests.map(t => {
    if (t.cond) return { t, cond: true, pass: t.cond.every(k => st[k].ok) };
    oi++;
    let mine;
    if (!bad.length) mine = t.out;
    else if (unknown) mine = null;
    else if (m.perLine) {
      const L = t.out.split('\n');
      bad.forEach(o => { const w = o.x.w, v = w.outs ? w.outs[oi] : w.out; if (v != null) L[m.blanks[o.i].line] = v; });
      mine = L.join('\n');
    } else {

      if (m.combos && bad.every(o => o.x.w.tag) && m.combos[tags]) mine = m.combos[tags][oi];
